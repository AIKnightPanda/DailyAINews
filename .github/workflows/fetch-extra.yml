# 补充源预抓
# ============================================================================
# 在 Routine（21:30 UTC）之前把五个补充源抓好，提交进仓库，Routine 起来直接读。
#
# 这一步是**备份，不是必需**：Routine 所在的云端环境已放行这五个域名，
# 没有预抓文件时 archive.js 会自己实时抓。所以这里抓失败、跑晚了、甚至没触发，
# 都只是回落到实时抓取，当期简报照出。
#
# 2026-09-05 缓冲从 30 分钟拉到约 3 小时，跟 fetch-ideas 一起改的——
# 虽然这条本身有实时抓取兜底、没那么急，但同一天两条 workflow 一起被
# GitHub 调度延迟了近 110 分钟，索性一起挪，分钟数也避开整点/整半点。
name: fetch-extra

on:
  schedule:
    - cron: '33 18 * * *'     # 03:33 北京时间，紧跟 fetch-ideas 之后，比 Routine 早约 2h57m
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-extra
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 一天只该跑这一次。fetch-extra.js 抓完会把 URL 记进 extra-seen.json，
      # 同一天再跑一次只会返回 0 条，把上一次的成果覆盖掉。
      - name: 抓取补充源
        run: |
          set -o pipefail
          ISSUE=$(date -u +%F)
          echo "窗口截至 $ISSUE"
          # 抓不到也要继续：写出的 JSON 里带着每个源的 status，下游据此提示
          node scripts/fetch-extra.js --until="$ISSUE" > digests/extra-pending.json || true
          node -e '
            const fs = require("fs");
            let j;
            try { j = JSON.parse(fs.readFileSync("digests/extra-pending.json", "utf8")); }
            catch { console.log("输出不是合法 JSON，丢弃"); fs.rmSync("digests/extra-pending.json", { force: true }); process.exit(0); }
            const ok = (j.sources || []).filter(s => s.status === "ok").length;
            console.log(`条目 ${(j.items || []).length} 条，成功源 ${ok}/${(j.sources || []).length}`);
            for (const s of j.sources || []) console.log(`  ${s.status.padEnd(6)} ${s.name} ${s.error || ""}`);
          '

      - name: 提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/extra-pending.json digests/extra-seen.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变化，不提交"
          else
            git commit -m "chore: 预抓补充源 $(date -u +%F)"
            # Routine 也往 main 推（21:30 UTC）；万一撞上就 rebase 重试
            for i in 1 2 3; do
              git push origin main && break
              echo "推送失败，rebase 后重试 ($i/3)"
              git pull --rebase origin main || exit 1
            done
          fi
