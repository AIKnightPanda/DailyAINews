# 灵感候选源预抓 + 归档 + 深挖
# ============================================================================
# 在 Routine（21:30 UTC）之前把榜单和订阅邮件抓好、归档、深挖完，提交进仓库，
# Routine 起来直接读。**深挖也放在这里跑**（2026-09-06 起）—— 那一步要连到
# Reddit / Stack Exchange / Product Hunt 等第三方域名，Routine 那边的沙箱
# 网络策略会挡一部分（见 ideas-deepen.js 顶部注释），GH Actions 的 runner
# 没有这层限制。Routine 自己还会再跑一遍 archive/deepen，但那时候大部分
# 条目已经有 deep 字段，会被跳过、不重新发请求，只需要给漏网的少数条目
# 兜底，暴露给沙箱网络限制的条目数比之前小得多。
#
# 和 fetch-extra 的关系：那个是备份（云端也能实时抓），**这个不是**。
# 候选部分云端可以实时抓，但**邮件部分只能在这里跑** —— Routine 的沙箱里
# 没有 Gmail 凭证，也不该有。所以这条工作流挂了，当期就没有 IdeaBrowser 那条。
#
# 排在 fetch-extra 之前，两条工作流都往 main 推，靠 rebase 重试避让。
#
# 2026-09-05 把缓冲从 50 分钟拉到约 3 小时：实测 9/4 这两条 workflow 都被
# GitHub 自己的调度延迟了近 110 分钟（`schedule` 触发不保证准点，高峰期常见），
# 50 分钟缓冲被吃光后 Routine 只能现抓，直接撞上沙箱的网络限制。
# 分钟数刻意避开整点/整半点，躲开 GitHub 文档提到的那类拥堵时段。
#
# 2026-09-11 再提前到 16:13 UTC（北京 00:13）。18:13 的设定实际每天
# 20:48–21:28 才被触发（延迟 2.5–3 小时），加上归档+深挖整条要跑 22–26 分钟，
# 收尾时间 21:13–21:50，已经和 21:30 的 Routine 贴脸：09-07 那次 21:28 才开跑，
# 提交时 Routine 已经推了 ideas/raw 和 seen.json，rebase 冲突直接失败。
# **不能再往前了**：期号取北京日期（下面「定期号」那步），16:00 UTC 之前
# 触发会算成前一天，整份预抓对不上 Routine 的期号。按 3 小时延迟算也在
# 19:30 前跑完，离 Routine 还有 2 小时。
name: fetch-ideas

on:
  schedule:
    - cron: '13 16 * * *'     # 00:13 北京时间，比 Routine（05:30）早约 5h17m；不能早于 16:00 UTC，见上
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-ideas
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 期号取 Asia/Shanghai 当天，和 ideas-archive.js 的规则一致。
      # UTC 20:40 已经是北京时间次日 04:40，所以这里必须 +8 小时再取日期。
      - name: 定期号
        run: echo "ISSUE=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_ENV"

      # reddit 那几个源串行 + 退避（含短语搜索），整步约 3–5 分钟，正常
      - name: 抓候选源
        run: |
          echo "期号 $ISSUE"
          node scripts/fetch-candidates.js --until="$ISSUE" > ideas/candidates-pending.json || true
          node -e '
            const j = require("./ideas/candidates-pending.json");
            const ok = (j.sources || []).filter(s => s.status === "ok").length;
            console.log(`候选 ${(j.items||[]).length} 条，成功源 ${ok}/${(j.sources||[]).length}`);
            for (const s of j.sources || []) console.log(`  ${s.status.padEnd(6)} ${s.name} ${s.error || ""}`);
          '

      # 脱敏是「不把订阅者凭证推进公开仓库」的第一道闸，跑之前先确认它还好使。
      # 这一步失败就整个停下：宁可当天没有邮件源，也不要在闸坏了的情况下往下走。
      - name: 自检脱敏
        run: node scripts/fetch-inbox.js --selftest

      # 没配 Secrets 时脚本自己会输出带 error 的合法结构，不会让这一步失败 ——
      # 榜单那半边照常出，只是当期少了邮件源。
      - name: 抓订阅邮件
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: |
          node scripts/fetch-inbox.js --until="$ISSUE" > ideas/inbox-pending.json || true
          node -e '
            const j = require("./ideas/inbox-pending.json");
            if (j.error) console.log(`⚠️ ${j.error}`);
            console.log(`邮件 ${(j.items||[]).length} 条`);
            for (const s of j.sources || []) console.log(`  ${s.status.padEnd(6)} ${s.name} ${s.error || ""}`);
          '

      # 兜底：万一 fetch-inbox.js 的 sanitize 漏了什么，别把订阅者 token
      # 推进公开仓库。只匹配**确实是凭证**的形状，不匹配单词 —— 早先的版本
      # 把裸词 unsubscribe 也算上，那样一条讲「退订管理」的正当点子就会让
      # 整天的提交失败。
      #
      # 命中不是让整个工作流失败，而是**只丢掉邮件那半边**：榜单照常提交。
      # 「绝不泄漏」和「绝不因此丢掉一整天」两条都要满足。
      - name: 检查没有个人凭证漏出去
        run: |
          if grep -aEiq 'https?://[^"]*(unsubscribe|/preferences|list-manage)|[?&]token=|eyJ[A-Za-z0-9_-]{12,}\.[A-Za-z0-9_-]{12,}' ideas/inbox-pending.json; then
            echo "::warning::邮件预抓结果里出现疑似个人凭证，已丢弃该文件，本期不带邮件源"
            node -e '
              const fs = require("fs");
              fs.writeFileSync("ideas/inbox-pending.json", JSON.stringify({
                fetchedAt: new Date().toISOString(),
                windowUntil: process.env.ISSUE + "T23:59:59.000Z",
                error: "预抓结果疑似含个人凭证，已丢弃（见 fetch-ideas 工作流日志）",
                sources: [], items: []
              }, null, 2));
            '
          else
            echo "干净"
          fi

      # 归档 + 深挖：放在这里而不是留给 Routine，是因为 Routine 跑在受限
      # 沙箱里，那边的出站网络策略会挡掉 Reddit / Stack Exchange / Product
      # Hunt 这些第三方域名——2026-09-06 实测：当天 26 条入围深挖的候选里
      # 18 条直接报 `HTTP 403：Blocked by egress policy`，中文精选那一侧
      # 只剩 2 条候选能看。GH Actions 的 runner 没有这层限制，深挖搬到这里
      # 跑完、连同 ideas/raw/<期号>.json 一起提交，Routine 起来之后自己
      # 再跑一遍 ideas-archive.js / ideas-deepen.js 时，已经有 deep 字段的
      # 条目会被跳过（不重新发请求）——见 ideas-deepen.js 里
      # `targets = chosen.filter(({ it }) => force || !it.deep)`，
      # 所以这一步搬过来对 Routine 那边是安全的空转，只有这里没抓全/
      # 当天新冒出来的条目才会由 Routine 现抓补一次，暴露面比之前小得多。
      - name: 归档并深挖
        run: |
          node scripts/ideas-archive.js --issue="$ISSUE"
          node scripts/ideas-deepen.js --issue="$ISSUE"

      - name: 提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ideas/candidates-pending.json ideas/inbox-pending.json \
            "ideas/raw/$ISSUE.json" ideas/seen.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变化，不提交"
          else
            git commit -m "chore: 预抓灵感源 $ISSUE"
            for i in 1 2 3; do
              git push origin main && break
              echo "推送失败，rebase 后重试 ($i/3)"
              git pull --rebase origin main || exit 1
            done
          fi
