/* ── 令牌：浅色为基准，两处深色块只重定义令牌 ───────────────────── */
:root {

}

    --ink-2:   #8D9C97;
    --ink-3:   #6B7A76;
    --rule:    #26302D;
    --rule-2:  #1E2724;
    --accent:  #4CC3A9;
    --accent-wash: rgba(76, 195, 169, 0.12);

  }
}
:root[data-theme="dark"] {
  --paper:   #0E1211;
  --surface: #161C1A;
  --sunk:    #101615;
  --ink:     #E4E9E6;
  --ink-2:   #8D9C97;
  --ink-3:   #6B7A76;

  --rule-2:  #1E2724;

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {

  color: var(--ink);
  font-family: var(--font-body);

}
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

/* ── 报头 ─────────────────────────────────────────────────────── */
.masthead {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: baseline; gap: 1rem;
  padding: 0.85rem clamp(1rem, 3vw, 2rem);

  border-bottom: 1px solid var(--rule);
}
.masthead h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.2rem;
  letter-spacing: -0.01em;
  font-variation-settings: 'SOFT' 0, 'WONK' 1;
  white-space: nowrap;
}
.masthead .tagline {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--ink-3);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.masthead .spacer { flex: 1; }
.theme-toggle {
  border: 1px solid var(--rule);
  background: var(--surface);
  color: var(--ink-2);
  font-family: var(--font-mono);
  font-size: 0.68rem;
  letter-spacing: 0.06em;
  padding: 0.3rem 0.6rem;
  border-radius: 999px;
  cursor: pointer;
  align-self: center;
  white-space: nowrap;
}
.theme-toggle:hover { color: var(--accent); border-color: var(--accent); }

/* ── 骨架 ─────────────────────────────────────────────────────── */
.shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  gap: clamp(1.5rem, 4vw, 3.5rem);
  max-width: 78rem;
  margin: 0 auto;
  padding: 0 clamp(1rem, 3vw, 2rem) 5rem;
}

/* ── 侧栏：期号索引 ────────────────────────────────────────────── */
.index {
  position: sticky;
  top: 3.6rem;
  align-self: start;
  max-height: calc(100vh - 4.5rem);
  overflow-y: auto;
  padding: 1.5rem 0 2rem;
  display: flex; flex-direction: column; gap: 0.5rem;
}
.index-head {
  font-family: var(--font-mono);
  font-size: 0.66rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;

}

  border: 0; border-left: 2px solid transparent;

  padding: 0.7rem 0.75rem;
  cursor: pointer;
  border-radius: 0 4px 4px 0;
  transition: background 0.14s ease, border-color 0.14s ease;
}
.issue-card:hover { background: var(--sunk); }
.issue-card[aria-current="true"] {
  background: var(--accent-wash);
  border-left-color: var(--accent);
}
.issue-card .date {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.02rem;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
  display: flex; align-items: baseline; gap: 0.45rem;
}
.issue-card .dow {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--ink-3);
  letter-spacing: 0.08em;
}
.issue-card[aria-current="true"] .date { color: var(--accent); }

  overflow: hidden;
}
.issue-card .tally {
  margin-top: 0.4rem;
  font-family: var(--font-mono);
  font-size: 0.63rem;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  display: flex; gap: 0.55rem; flex-wrap: wrap;
}

}
.issue-head .headline {

}
.meta-strip {
  display: flex; flex-wrap: wrap; gap: 0.4rem 1.1rem;
  font-family: var(--font-mono); font-size: 0.68rem;
  color: var(--ink-3); letter-spacing: 0.03em;
  margin-bottom: 2.2rem;
  font-variant-numeric: tabular-nums;
}
.meta-strip b { color: var(--ink-2); font-weight: 500; }
.meta-strip .warn { color: var(--mark); background: var(--warn-bg); padding: 0.1rem 0.45rem; border-radius: 3px; }

/* 正文排版 */
.body { max-width: 40rem; }
.body h2 {
  font-family: var(--font-display);
  font-weight: 600; font-size: 1.02rem;
  letter-spacing: 0.1em;
  color: var(--accent);
  margin: 3.2rem 0 1.4rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--rule);
  font-variation-settings: 'SOFT' 0, 'WONK' 0;
}
.body h2:first-child { margin-top: 0; }
.body h3 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.33rem;
  line-height: 1.28;
  letter-spacing: -0.015em;
  margin: 2.4rem 0 0.75rem;
  text-wrap: balance;
  font-variation-settings: 'SOFT' 0, 'WONK' 1;
}
.body p { margin: 0 0 1.05rem; line-height: 1.78; text-wrap: pretty; }
.body strong { font-weight: 600; color: var(--ink); }

  font-family: var(--font-mono); font-size: 0.86em;

.body ul, .body ol { margin: 0 0 1.15rem; padding-left: 1.3rem; display: flex; flex-direction: column; gap: 0.55rem; }
.body li { line-height: 1.72; padding-left: 0.2rem; }
.body li::marker { color: var(--accent); font-family: var(--font-mono); font-size: 0.85em; }
.body blockquote {
  margin: 0 0 1.3rem; padding: 0.85rem 1.1rem;
  background: var(--sunk);
  border-left: 2px solid var(--mark);
  border-radius: 0 4px 4px 0;
  color: var(--ink-2); font-size: 0.94rem; line-height: 1.65;
}
.body blockquote p:last-child { margin-bottom: 0; }

/* 来源链接组 */
.sources { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 2rem; }
.sources a {
  font-family: var(--font-mono); font-size: 0.7rem;
  text-decoration: none; color: var(--ink-2);
  border: 1px solid var(--rule);
  background: var(--surface);
  padding: 0.28rem 0.6rem; border-radius: 999px;
  transition: color 0.14s ease, border-color 0.14s ease;
  white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}
.sources a:hover { color: var(--accent); border-color: var(--accent); }
.sources a::before { content: "↗ "; color: var(--ink-3); }
.sources a:hover::before { color: var(--accent); }

.empty { color: var(--ink-2); padding: 4rem 0; }

/* ── 窄屏：索引变成顶部横滑 ────────────────────────────────────── */
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; }

    position: static; max-height: none; overflow: visible;
    flex-direction: row; gap: 0.5rem;

    overflow-x: auto; scrollbar-width: thin;

  }

  .issue-card {
    flex: 0 0 auto; width: 13.5rem;
    border-left: 0; border-bottom: 2px solid var(--rule-2);
    border-radius: 4px 4px 0 0;
  }
  .issue-card[aria-current="true"] { border-left: 0; border-bottom-color: var(--accent); }
  .issue-card .head { -webkit-line-clamp: 1; }
  .reader { padding-top: 1.8rem; }
  body { font-size: 16px; }
}

/* 窄到放不下副标题时，先舍弃副标题而不是让报头折行 */

  .masthead .tagline { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }

<script>window.__DIGESTS__ = {"builtAt":"2026-08-23T01:46:12.579Z","issues":[{"issue":"2026-08-22","headline":"Anthropic 推出 Claude Security 用 Mythos 5 扫代码漏洞，Chess.com 证明超人 AI 不会终结人类技艺","feedGeneratedAt":"2026-08-22T06:27:29.601Z","stats":{"builders":16,"tweets":34,"blogs":0,"podcasts":1},"rawBytes":83183,"rawMissing":false,"body":"## 一、X / Twitter\n\n### Anthropic 推出 Claude Security：把 Mythos 5 用在找漏洞上\n\n**Anthropic 官方（claudeai on X）** 用一条线程发布了本期最实质的产品新闻。把 Claude Security 指向一个 GitHub 仓库，**Mythos 5** 会扫描漏洞——跨文件追踪数据流，并推理各组件如何交互。每条发现都附带 **CWE 分类、置信度与严重性评级，以及一个建议修复方案**。\n\n工程上的安排值得注意：建议的补丁直接在网页版 Claude Code 里打开，**使用你团队已经在用的模型**。官方明确说明了这个设计的用意——\"让防守方更多地获得 Mythos 的结果，而不需要直接访问模型本身：模型跑在扫描背后，只返回发现。\"扫描按你现有套餐下的标准 token 用量计费。\n\n这只是一组动作里的一步：他们正与合作伙伴把 Mythos 5 集成进各自的安全产品与服务，新设的 **Defender Advantage Fund 为开源安全提供 3500 万美元额度**，并将在未来几周扩大 Cyber Verification Program。\n\n🔗 https://x.com/claudeai/status/2090852316328902930 · https://x.com/claudeai/status/2090852318527033804 · https://x.com/claudeai/status/2090852320128938319\n\n### Meta AI 高级总监 Madhu Guru：别把漂亮的 eval 套件压成一个分数\n\n**Madhu Guru（realmadhuguru on X）** 的 eval 系列第五篇，直指一个几乎所有团队都会犯的错——把复杂的评测结果简化成单一分数，通常是因为某位高层想要一个便于决策的数字。他说 Gemini 早期他们自己就这么干过。\n\n他给这个现象起了个名字：**平均数的暴政（the tyranny of the average）**。理由是 AI 系统的质量根本不是一个单一维度。他举的例子很直观——某个模型从：\n\n- 简单摘要 85% → 89%\n- 基础事实问答 80% → 85%\n- **复杂财务分析 70% → 63%**\n\n单一分数会掩盖掉一个事实：模型在**你的前沿用例上变差了**。\n\n而常见的补救——加权平均——在他看来更糟：\"你为一个判断性的决定制造了虚假的、数学化的精确感。\"他给的做法是：按第四篇讲的阶梯保留一份带优先级的 eval 清单；找那些愿意看细节、不追求抽象简化的人；把所有关键 eval 结果理解透——在哪儿失败、在哪儿出色——然后判断新系统对用户到底是更好还是更差。\n\n🔗 https://x.com/realmadhuguru/status/2090930137885774324\n\n### OpenAI Codex 限速风波续集：这次是缓存命中率\n\n**Thibault Sottiaux（thsottiaux on X，Codex & ChatGPT @ OpenAI）** 对昨天那轮用量争议给了新的技术解释。这次他确认确实观察到了异常：**部分用户本周的缓存命中率比前几周的稳定状态更差**。由于持续命中缓存是效率的重要组成部分，这可以解释为什么这些用户的额度消耗得更快。他表示正在调查，次日会有更新。\n\n另外两条是好消息：**banked reset 已经上线**，覆盖 ChatGPT Work 和 Codex 的全部付费用户。\n\n🔗 https://x.com/thsottiaux/status/2091033630147854385 · https://x.com/thsottiaux/status/2090964822422949999\n\n### Anthropic 的 Thariq：内部用得很多的一个 skill —— ELI5\n\n**Thariq（trq212 on X，Claude Code @ Anthropic）** 分享了 Anthropic 内部最近用得很多的一个 skill：`/eli5`，全称是\"解释得像我对这个话题一无所知，用一个图大字少的 HTML artifact\"。\n\n他给的用法例子说明了它的真实场景不止于教学：\n\n- `/eli5 how does this module work` —— 搞懂一个模块\n- `/eli5 why did we make this tradeoff` —— 追溯一个权衡的来由\n- `/eli5 what caused this incident` —— 复盘一次事故\n\n他说正在考虑要不要把它做成官方插件，目前可以先从社区市场装：\n\n```\nclaude plugin marketplace add anthropics/claude-plugins-community\nclaude plugin install eli5@claude-community\n```\n\n🔗 https://x.com/trq212/status/2090884854590382515 · https://x.com/trq212/status/2090884855798407576 · https://x.com/trq212/status/2090890394880155888\n\n### FPV 合伙人 Nikunj Kothari：用 Claude Code 逆向幼儿园的菜单接口\n\n**Nikunj Kothari（nikunj on X）** 贡献了本期最接地气的一个 agent 用例，他自己评价\"这件事仍然被严重低估\"。\n\n他女儿刚上幼儿园，每日餐食公布在一个随便什么网站上，数据毫无结构。他让 Claude Code **通过网络请求去找出背后的 API**——结果那个接口恰好没有鉴权——Claude Code 摸清了返回格式，把它接到了他们家已有的 Hermes bot 上。\"所以现在每天早上，我们家的 Home bot 会告诉我们早餐和午餐吃什么，好让我们准备该带的食物。\"\n\n🔗 https://x.com/nikunj/status/2090884422178627624\n\n### Box CEO Aaron Levie：智能便宜到不用计量之后，机会在扩散\n\n**Aaron Levie（levie on X）** 给出了一个宏观判断：\"当下 AI 的进步速度，不同于科技史上任何一个时期。\"他列的四条同时发生的变化是：同等任务下模型变得更便宜、通用能力更强、速度更快，而且在几乎每个领域都在往纵深走。\n\n他的推论是：**当智能便宜到不值得计量，最大的机会就变成了推动 AI 向经济体各处扩散**。因此这是做应用型 AI 公司的好时候——大量的创新与竞争本身就成了你自身进展的顺风。\n\n🔗 https://x.com/levie/status/2091038566260539574\n\n### Swyx：模拟（Simulation）是新的 scaling law\n\n**Swyx（swyx on X，smol.ai / Latent Space）** 罕见地公开承认自己看走眼了一件事。他说\"模拟是一条新的 scaling law\"这句话很容易被当成营销夸张，但在最近一期访谈进行到一半时，他从\"多少有点在开玩笑\"变成了\"非常非常严肃\"。\n\n他的推理链是：如果你认真对待 RSI（递归自我改进）——模型自动化 ML 研究和 AI 工程中越来越大的部分——那么**最后一道屏障就是模拟人类和人类反馈**。这让他终于理解了两年前 Karpathy 和李飞飞为什么会支持 Smallville 那批研究者：当时那项工作零商业应用，但方向是对的。他认为 Simile 显然是做这件事的团队，且在这么早期就已经在财富 100 强客户那里找到了 PMF。\"我从没这么高兴自己错得这么离谱。\"\n\n🔗 https://x.com/swyx/status/2090948945753076141\n\n### 产品人 Peter Yang：Instinct 做得很好，但它索引了我的邮件还不让删\n\n**Peter Yang（petergyang on X）** 给了一份少见的、褒贬都很具体的产品评测。优点是**上手流程极其顺滑**——连接 iMessage、Google Workspace 和自己的 MCP 都很流畅，\"最好的建造者会优先做好 onboarding 和新用户需求\"；而且它比其他助手更主动，连上 MCP 后会立刻建议它能做的事。\n\n局限是所有对话挤在**一个线程**里，这让他没法用它做真正的工作——他对 @bot 也有同样的意见：UX 很干净，但他常常想对同一个 bot 开多个并行线程。结论是他会把 Instinct 用于杂事，正经工作仍留在 ChatGPT Work 和 Codex。\n\n随后他发了一条措辞严厉得多的：**\"未经我许可就索引并保留我的邮件、还不让我从你们的记录里删除，这不太好吧？\"** 他表示在这个问题解决之前，无法向任何人推荐这款产品。\n\n🔗 https://x.com/petergyang/status/2090814910720835633 · https://x.com/petergyang/status/2090936583814025417\n\n### Vercel CEO Guillermo Rauch：把评测标准自己刷到满分\n\n**Guillermo Rauch（rauchg on X）** 描述了一个有点递归意味的做法：\"看着它发生的过程很狂野。我们把 `is-agentic` 放在循环里反复跑，直到拿到 100/100。\"他说这个过程**让他们补上了不少缺口**，并强调他们花了大力气确保评测标准本身质量够高、值得占用你的时间和 token。\n\n同期他还宣布产品开始支持 Grok 与 Codex 订阅，可在沙箱里试用，安装是即时的。\n\n🔗 https://x.com/rauchg/status/2090858571613470919 · https://x.com/rauchg/status/2090953806624489501\n\n### Peter Steinberger：给 agent 的世界不该有门\n\n**Peter Steinberger（steipete on X）** 在伯克利的 Agentic AI Summit 做了演讲，题目是 **\"No Doors for Agents\"**（不要给 agent 设门）。\n\n🔗 https://x.com/steipete/status/2090898421108605078\n\n### Zara Zhang：每天出现，一直在发布\n\n**Zara Zhang（zarazhangrui on X，本 skill 的作者）** 的三句话方法论：\"每天出现。永远在发布。不要害怕重复自己，一遍又一遍又一遍。\"\n\n🔗 https://x.com/zarazhangrui/status/2090702627206214081\n\n## 二、播客\n\n> 本期 feed 中官方博客无新增内容，故无博客板块。\n\n### No Priors：Chess.com 告诉我们的超人能力启示 —— Erik Allebest\n\n**核心结论**：国际象棋是\"超人 AI 已经存在三十年\"的活体样本，而它给出的答案是——人类技艺不但没有贬值，反而比历史上任何时候都更繁荣。\n\nErik Allebest 是 Chess.com 的 CEO。2005 年他从破产拍卖里以 **55 美元**买下 chess.com 这个域名，当时几乎所有投资人都告诉他这是个不可投资的小众爱好项目。二十年后的今天：约 **1000 万日活、四五千万月活、超过 2.5 亿注册会员**，今年收入将略超 **2 亿美元**，团队约 650 人，目标是让十亿人下棋。他自己形容这些数字\"说出来都觉得离谱\"。而且这门生意**从未依靠融资输血来增长**——历次交易都是老股东之间的股份转让，没有注资。\n\n最值得 AI 从业者听的是他对\"超人机器\"的态度。计算机在国际象棋上碾压人类已经三十年，当年很多人认为这是对这项运动的生存威胁、会终结这个游戏。结果恰恰相反。他的结论说得毫不含糊：\n\n> \"非常清楚的是，即使机器能超越他们，人们依然想获得人类的技能，而且他们想看。即使机器能做得好得多，他们依然欣赏卓越的人类技艺。……认为在超人 AI 的世界里人类技能不再相关、而且这仅仅是技术本身的产物——这种想法是无稽之谈。\"\n\n他对作弊的讨论也几乎可以整段搬到今天的 AI 语境里——毕竟这正是\"机器能产出超人结果，并冒充人类表现\"的最早战场。他承认这件事让人沮丧，但也提醒：**象棋对抗作弊的历史远早于 AI**，而且\"我们同样拥有对抗作弊的技术\"。他们在反作弊上投入了大量时间、金钱和资源，靠的是更多数据、更多统计模型和机器学习模型——至于具体手段，他明确表示不打算细说，免得给人提供思路。\n\n关于如何变强，他给的答案\"既幸运又不幸地\"简单：没有捷径，就是小模块的重复——做战术题、复盘自己的错误、针对性训练。\"这和你训练神经网络是一样的：你喂给它一堆数据。当然它可以并行训练……我们的大脑不太是那样运作的，但我们必须把重复次数放进去。\"他认为社交媒体带来的即时性让很多人忘了，**练习是无法走捷径的**。\n\n至于 AI 在公司内部的用法，他描述了一种\"共生\"：自动化让支持团队更快给出答案，而人类同事负责创造这些自动化并处理真正需要人对人的部分；数据分析师用 LLM 去问和答更有意思的问题；产品开发上则推进 agentic development，目标是\"**缩短从发现机会或问题、到把代码推给用户之间的时间**\"——因为层层交接的传统流程会把这个周期拖得非常长。\n\n> ⚠️ 数据说明：feed 中此期播客只提供了频道页链接，未提供具体视频 URL，属上游 feed 的数据缺口。\n\n🔗 https://www.youtube.com/@NoPriorsPodcast"},{"issue":"2026-08-21","headline":"Anthropic 复盘 Claude Code 质量滑坡，企业级安全护栏将进客户自有基础设施","feedGeneratedAt":"2026-08-21T07:07:46.815Z","stats":{"builders":14,"tweets":31,"blogs":3,"podcasts":1},"rawBytes":0,"rawMissing":true,"body":"> **存档说明**：本期原始数据在归档规则调整时被同日的新 feed 覆盖，仅存正文。正文内容均来自当时的真实 feed，未作改动。\n\n## 一、X / Twitter\n\n### Anthropic 的 Claude Code 团队：企业安全护栏要搬进客户自己的机房\n\n**Boris Cherny（bcherny on X，Claude Code @ Anthropic）** 和 **Thariq（trq212 on X，同团队）** 同日放出同一件事的两个侧面。Thariq 的说法是：即将推出的 Fable 企业级安全护栏**运行在客户自己的基础设施上**，由客户控制数据存放位置和访问权限，已经和约 100 家公司共同打磨了一段时间，计划秋季更广泛推出。\n\nBoris 补充了动机：\"Mythos 级别的模型需要额外的安全措施，而企业需要满足自己的隐私与合规规定。客户可以拥有并控制自己的数据，Anthropic 一点都不保留。\"\n\n值得注意的是这条和下面三篇官方博客构成了同一条主线——把 agent 的执行环境交还给客户，只保留编排层。\n\n🔗 https://x.com/trq212/status/2090569474139439335 · https://x.com/bcherny/status/2090537902912815536\n\n### OpenAI Codex 负责人回应用量限制争议：问题出在 sub2api\n\n**Thibault Sottiaux（thsottiaux on X，Codex & ChatGPT @ OpenAI）** 正面回应了社区关于\"Codex 用量限制被偷偷调低\"的质疑。他的结论很明确：OpenAI 没有改过限制，\"这不是我们会在不与社区沟通、不保持透明的情况下做的改动。\"\n\n真实原因是——在与受影响用户沟通后发现，其中很多人在用 **sub2api**：把订阅额度转换成 API 流量，再转售或分给多个用户使用。这类用法不被支持，会被反欺诈系统标记。他同时给出了安全区间：通过 Sign in With ChatGPT 使用订阅额度**完全没问题**，无论是官方客户端还是支持该登录方式的开源客户端（Pi、OpenCode 等）。\n\n同期他还宣布 GPT-Image-2 现已支持生成**透明背景图片**（ChatGPT 与 API 均可），以及可以创建并分享 ChatGPT Site 与他人协作。\n\n🔗 https://x.com/thsottiaux/status/2090675027670978569 · https://x.com/thsottiaux/status/2090631723302469995\n\n### Meta AI 高级总监 Madhu Guru：企业做不好 AI，是因为没有 eval 策略\n\n**Madhu Guru（realmadhuguru on X，Meta AI 高级总监，曾在 Google 主导 Gemini、Veo、Nano Banana）** 的 eval 系列第四篇，是本期最可直接落地的内容。他的核心判断：\"企业在构建像样的 AI 系统上举步维艰，根源是缺乏 eval 策略。\"\n\n他主张一套**阶梯式 eval 策略**——针对自己独特的用例，在成本/真实度光谱上布置多层评测：\n\n- **爬坡 eval（hill-climb）**：推动产品能力边界，需要持续刷新，用来提升质量、扩展功能面\n- **回归 eval（regression）**：爬坡的同时，有没有把今天的产品搞坏？\n- **冒烟 eval（smoke test）**：安全底线和绝对基础，题目不一定难，但绝不能错——比如产品身份认知\n- **上线 eval（launch）**：接近真实流量的在线测试，可控性最低，但最真实\n\n🔗 https://x.com/realmadhuguru/status/2090595384905113939\n\n### Box CEO Aaron Levie：垂直领域够深时，专门训一个模型开始划算了\n\n**Aaron Levie（levie on X）** 点评了一篇关于应用型 AI 后训练的文章，落点在成本结构的转变。他引用的关键段落是：\"在后训练阶段，我们通过奖励塑形来激励高效的工具使用和推理，在性能相当的前提下优先选择推理时消耗 token 更少的轨迹。这让我们能够同时优化成本和质量，在保持成本稳定的同时获得显著的性能提升。\"\n\n他的判断是：一旦你对某个领域理解得足够深、且在一批相似任务上有足够的量，为这类工作专门设计模型就开始说得通了。但他也划了边界——这**不适用于每个领域**，多数情况下通用前沿模型（闭源或开源）开箱即用就够好甚至是必需的；只有当垂直经验足够深，且规模化成本过高**或**任务类型独特到别处不会训练它时，这笔账才算得过来。\n\n🔗 https://x.com/levie/status/2090664811185205722\n\n### FPV 合伙人 Nikunj Kothari：为什么投资人如此在意\"野心\"——算给你看\n\n**Nikunj Kothari（nikunj on X）** 用一套资金规模的数学解释了这件事。他列举的背景是：Anthropic 成为从零到万亿美元估值最快的公司，打破了各项收入纪录；OpenAI 在更长周期里做到了同样的事；SpaceX 以 1.77 万亿上市；而 Cursor 的收购是风向标——四年从零到 600 亿，给早期基金返还的 DPI 之多，带来了实打实的资金增长。\n\n于是 LP 用脚投票，钱涌向超大基金，而**基金规模变大反过来正当化了这种行为**：\"当你的基金这么大时，每一笔投资都必须按那么大的结果来承销。小的成功根本推不动那个数字。\"结果是即便评估一个 A 轮，承销逻辑也变成了\"这家公司能到万亿吗\"——如果信这个，入场价格几乎无关紧要，200、300、500 甚至 10 亿进场都不影响。\n\n他的结论一句话：\"**遗漏的错误远比误投的错误严重得多**，然后幂律自己会解决剩下的事。这就是为什么你在 pitch 的时候，野心如此重要。\"\n\n🔗 https://x.com/nikunj/status/2090585553947517298\n\n### Vercel CEO Guillermo Rauch：我们在建 agent 时代的 AWS\n\n**Guillermo Rauch（rauchg on X）** 用一句话概括了 Vercel 的定位：\"我们在建给 agent 用的 AWS。\"同时预告某个产品 0.0.5 版体积进一步缩小——\"xz 压缩后能装进两张软盘\"，并将在次日发布呼声最高的功能。他还祝贺了 Bun 的发布，称\"Bun 对简单、快速与开放的追求，与 Vercel 以及我们看待世界的方式完美契合\"。\n\n🔗 https://x.com/rauchg/status/2090520415336845595 · https://x.com/rauchg/status/2090600467592266240\n\n### Replit CEO Amjad Masad：与 OpenAI 的合作\"迟到了很久\"\n\n**Amjad Masad（amasad on X）** 宣布与 OpenAI 达成合作，并翻出一段前史：Replit 进 YC 之前，Paul Graham 曾让 Sam Altman 来招募他们。他还强调了新推出的 **Free Mode** 被低估的一点——**速度**，\"让写代码重新变得有交互感\"。\n\n🔗 https://x.com/amasad/status/2090514571513708874 · https://x.com/amasad/status/2090484698413740186\n\n### Swyx：NVIDIA 花 60 亿买下的那家\"模型工厂\"\n\n**Swyx（swyx on X，smol.ai / Latent Space）** 提到最新一期播客聊的是 NVIDIA 为何以 60 亿美元收购 Eisokant 的模型工厂——他强调\"看数字，说这些模型能打败 Thinky 并不夸张\"。\n\n另一条则在推动 Skills 生态：他称 Matt Pocock 按总播放量已是 AI Engineer 大会历史上最热门的讲者，其 `/grill-me` 已经一路传到 Satya Nadella 那里；而新的 `/wayfinder` 是\"给 `/grill-me` 用的 `/grill-me`\"——当你还处在战争迷雾中、尚不知道自己不知道什么时，用它来编排调研和后续的拷问环节。\n\n🔗 https://x.com/swyx/status/2090577677916807429 · https://x.com/swyx/status/2090550020496040266\n\n### 产品人 Peter Yang：让管理者 agent 去\"激将\"工作 agent\n\n**Peter Yang（petergyang on X）** 提了个粗糙但有意思的直觉：很多 AI 产出可以仅靠加一个循环就改善——让一个管理者 agent 用这类话去激工作 agent：\"你确定这是你能做到的最好水平吗？\"\"我觉得你能做得更好，再来一次。\"\"再仔细看看，给我 11 分（满分 10 分）的产出。\"\n\n他同时宣布 YouTube 频道突破 10 万订阅，并预告了几期访谈，包括 Hamel Husain 与 Shreya Shankar 谈\"今天的模型如何彻底改变了 evals\"。\n\n🔗 https://x.com/petergyang/status/2090564541499498919\n\n### SPC 普通合伙人 Aditya Agarwal：最好的创始人是还原主义者\n\n**Aditya Agarwal（adityaag on X，前 Facebook 早期工程师、Dropbox CTO）** 抛出一句判断：\"最好的创始人是还原主义者。\"他同时上线了与 **Sridhar Ramaswamy**（曾把 Google 广告业务从 10 亿做到 1000 亿，现带领 Snowflake 穿越 AI 转型）的访谈，并说明 SPC 最看重的特质之一是**清晰（Clarity）**——诚实的能力、穿透战争迷雾的能力、在浑水中划出航道的能力。\n\n🔗 https://x.com/adityaag/status/2090501112927223889 · https://x.com/adityaag/status/2090478527313252494\n\n### Zara Zhang：动机跟在行动后面\n\n**Zara Zhang（zarazhangrui on X，本 skill 的作者）** 分享了一条小而准的观察。她说自己那天没什么动力，去和 Claude 聊了聊，得到一句彻底改变她对动机看法的话：\"**动机更多是跟在行动后面，而不是走在行动前面。**\"\n\n🔗 https://x.com/zarazhangrui/status/2090399357145317837\n\n## 二、官方博客\n\n### Anthropic Engineering：关于近期 Claude Code 质量反馈的复盘\n\n这是一篇少见的、把话说得很具体的事故复盘。过去一个月里关于\"Claude 回答变差了\"的反馈，被追溯到**三个互相独立的变更**，影响了 Claude Code、Claude Agent SDK 和 Claude Cowork——**API 未受影响**。三个问题均已在 v2.1.116 修复。\n\n三个变更分别是：\n\n1. **3 月 4 日**，把 Claude Code 默认推理强度从 high 降到 medium，本意是缓解 high 模式下长到\"UI 看起来像卡死\"的延迟。官方直接承认\"**这是个错误的权衡**\"，并在 4 月 7 日回滚——因为用户表示更希望默认走高智能，简单任务再自行降档。影响 Sonnet 4.6 与 Opus 4.6。\n2. **3 月 26 日**，为降低恢复会话时的延迟，上线了\"清理闲置一小时以上会话中较早思考内容\"的改动。一个 bug 导致这个清理在整个会话剩余时间里**每一轮都执行**，而非只做一次，于是 Claude 显得健忘且重复。4 月 10 日修复。同样影响 Sonnet 4.6 与 Opus 4.6。\n3. **4 月 16 日**，加入了一条降低冗长度的系统提示词指令，与其他提示词改动叠加后**损害了编码质量**，4 月 20 日回滚。影响 Sonnet 4.6、Opus 4.6 与 Opus 4.7。\n\n最值得琢磨的是他们对\"为什么这么难查\"的解释：由于每个变更影响的是不同的流量切片、且时间表各不相同，**叠加起来的表象是一种宽泛而不一致的整体退化**。团队 3 月初就开始调查，但初期难以把它和用户反馈的正常波动区分开，内部使用和 evals 一开始都没能复现。作为补偿，4 月 23 日起为所有订阅用户重置了用量限制。\n\n🔗 https://www.anthropic.com/engineering/april-23-postmortem\n\n### Anthropic Engineering：扩展 Managed Agents —— 把大脑和手解耦\n\n这篇提出了一个很值得记住的观点：**harness（脚手架）编码的是\"Claude 自己做不到什么\"的假设，而这些假设会随模型变强而过期**，所以必须被反复质疑。\n\n他们给了一个自己踩过的例子：Claude Sonnet 4.5 会在感知到上下文上限逼近时提前草草收尾（所谓\"上下文焦虑\"），他们为此在 harness 里加了上下文重置；可当同一套 harness 用在 Claude Opus 4.5 上时，这个行为消失了——**那些重置变成了死重量**。\n\n于是他们构建了 Managed Agents，并把它类比成操作系统当年解决的问题：如何为\"尚未被构想出来的程序\"设计系统。几十年前操作系统把硬件虚拟化成 **process**、**file** 这类足够通用的抽象，抽象活得比硬件久——`read()` 并不关心自己读的是 1970 年代的磁盘组还是现代 SSD。Managed Agents 照搬了这个套路，把 agent 的组件各自虚拟化：**session**（记录一切发生过的事的追加日志）、**harness**（调用 Claude 并把工具调用路由到相应基础设施的循环）、**sandbox**（Claude 执行代码和改文件的环境），从而让任一实现都能被替换而不惊动其他部分。\n\n文中还有一节叫「别养宠物」，讲的是他们最初把所有组件塞进单个容器的后果：容器成了 pets-vs-cattle 里那只\"宠物\"——挂了会话就没了，卡住得靠人工救活，而唯一的观察窗口 WebSocket 事件流分不清究竟是 harness 的 bug、事件流丢包还是容器掉线。更糟的是，要排查就得进容器开 shell，而那个容器往往还装着用户数据，**等于实际上失去了调试能力**。\n\n🔗 https://www.anthropic.com/engineering/managed-agents\n\n### Claude Blog：Managed Agents 新增自托管沙箱与 MCP 隧道\n\n上一篇的产品化落地。即日起 Claude Managed Agents 可以在**你自己控制的沙箱**中运行，并连接到你的私有 MCP 服务器——agent 执行工具的沙箱和它触达的服务，都在企业既有的边界内，受你自己的安全与运行时控制。目前自托管沙箱为公开测试，MCP 隧道为研究预览（需申请）。\n\n分工很清晰：**编排、上下文管理和错误恢复的 agent 循环仍在 Anthropic 的基础设施上，工具执行则移到你配置的环境里**。代码执行、敏感文件、依赖包、服务和数据都不出企业边界，网络策略、审计日志和安全工具链沿用现成的；算力也归你控制——资源规格和运行时镜像由你设定，所以长时间构建、图像生成这类重计算任务能拿到需要的 CPU 和内存。\n\n沙箱可以自带，也可以用支持的托管方，各有侧重：**Cloudflare** 用 microVM 和更轻量的 isolate 大规模运行沙箱，出站请求受零信任密钥注入控制，可自定义代理来审计、改道或修改出口流量；**Daytona** 的沙箱是完整可组合的计算机，长时运行且有状态，会话期间可通过 SSH 或带认证的预览 URL 访问，也可以暂停后带完整状态恢复；**Modal** 的沙箱与其函数、存储、网络原语同源，自研容器运行时可在任意镜像上做到亚秒级启动，并扩展到数十万并发；**Vercel** 的沙箱结合 VM 安全、VPC 对等和自带云，启动时间以毫秒计，且**凭据由沙箱防火墙在网络边界注入，从不进入沙箱内部**。\n\n已有落地案例：Amplitude 基于 Managed Agents + Cloudflare 构建内部设计工具 Design Agent；Clay 的 GTM 工程 agent Sculptor 跑在 Managed Agents + Daytona 上；面向机构金融的 Rogo 则用 Managed Agents + Vercel Sandbox 处理专有数据。\n\n🔗 https://claude.com/blog/claude-managed-agents-updates\n\n## 三、播客\n\n### No Priors：从恢复视觉到重新构想大脑 —— Max Hodak\n\n**核心结论**：如果大脑真的只是一台通过少数几根线缆与世界相连的计算机，那么修复感官就不是医学问题，而是工程问题——而工程问题有确定的改进路径，生物学没有。\n\nMax Hodak 是 Science 公司的创始人兼 CEO，此前是 Neuralink 的联合创始人。他们的主打产品 Prima 是一款**视网膜假体**，刚刚在欧洲获得监管批准。\n\n他把它类比成\"眼睛的人工耳蜗\"：一枚微小芯片被植入视网膜之下，患者佩戴的眼镜带有激光投影仪，把图像投射到植入体上，绕过已死亡的视杆和视锥细胞直接刺激视网膜，从而把视觉信号送回大脑。适应症是感光细胞丧失导致的失明——临床试验做的是黄斑变性，接下来将开展视网膜色素变性、Stargardt 病等研究。\n\n临床试验结果他自己形容为\"好得不像真的\"：**有患者在填数独和填字游戏，有患者在读书**。\"此前从没有人能以这种方式在盲人患者的心灵之眼中恢复出成形的视觉图像。\"但他对现状同样直白——视野很小，\"**像是透过一根吸管看东西**\"，而且只有黑白。下一步是增加灰阶深度，他认为至少能做到红和绿，蓝色更棘手。当前版本面向美欧数十万患者，下一版本正在动物实验、有望明年进入人体，可将范围扩大到数百万人。\n\n他反复回到那个会激怒互联网的论断上——\"**如果你想让人生气，就去跟互联网说大脑是一台计算机**\"。但他坚持这不是隐喻：大脑通过颅神经和脊神经这少数几根\"小线缆\"与环境相连，视神经是第二对，负责听觉与平衡的前庭蜗神经是第八对。\"我们谈论缸中之脑，可颅骨就是那个缸。\"因此在他看来，把视觉、听觉、平衡、运动和体感信号送进送出大脑，**本身就是目的，就是那个核心对象**。\n\n这也解释了他为什么选择器械而非药物：\"如果我把电极放进初级运动皮层，你大概一小时后就能用电脑了。\"相比之下，小分子药物研发可以做十年，临床试验翻开一张牌，答案可能是否定的，然后所有人就散场回家了——而器械这条路\"我们很清楚该怎么把这东西做得更好\"。\n\n至于长远处，他的世界观相当极端也相当自洽：大脑是唯一一个原则上都无法移植的器官，\"心脏、胰腺、肝脏、肺，在我看来都是配角，它们存在是为了让大脑的活动保持有趣、保持运转。\"他补了一句听起来像玩笑但显然不是的话——\"**如果我最后是被自己的胰腺谋杀的，我会相当失望。**\"\n\n🔗 https://www.youtube.com/watch?v=7HXqMepjvy8"},{"issue":"2026-08-07","headline":"Box CEO 拆解 agent 采用的真实动态，Basis 创始人讲长任务 agent 怎么造","feedGeneratedAt":"2026-08-07T06:42:39.266Z","stats":{"builders":15,"tweets":31,"blogs":1,"podcasts":1},"rawBytes":0,"rawMissing":true,"body":"> **存档说明**：这一期是归档机制建立**之前**生成的，原始 feed 数据（`raw/2026-08-07.json`）未能保留，仅存正文。从 2026-08-22 期开始，每期都会同时归档完整原始数据。\n\n## 一、X / Twitter\n\n### OpenAI：免费用户获得无限文本对话\n\n**Thibault Sottiaux（thsottiaux on X，Codex & ChatGPT @ OpenAI）** 宣布 ChatGPT 免费用户现已获得**无限文本对话**，由 GPT-5.6 Luna 驱动。他还描述了 GPT-5.6 Sol 在 Codex 里的体感：\"你可以直接问 Codex 最离谱的要求，它就真的做了。我连着说五分钟那种看起来要几周工作量的事，然后起身去冰箱拿点东西、撸撸狗，回来一看……做完了。\"\n\n**Sam Altman（sama on X）** 同步确认：\"5.6 Sol 现在聊天能力好多了，而且免费用户无限文本对话。\"\n\n🔗 https://x.com/thsottiaux/status/2085610231707623750 · https://x.com/sama/status/2085454964814753990\n\n### Box CEO Aaron Levie：给 agent 写 prompt 更像写规格说明\n\n本期最值得读的一条。**Aaron Levie（levie on X）** 认为大多数人对 agent 的认知还卡在聊天机器人阶段：\"给 agent 写 prompt 更接近写一份规格说明，而不是问一个问题——你必须充分界定任务范围，并定义清楚什么叫'完成'。\"\n\n他的核心论点是：agent 的真正上限不在于把它当成又一个可以提问的系统，而在于**改造工作流本身**——给 agent 正确的数据、打通组织边界、重新设计人工复核环节。他预测企业内绝大部分 token 消耗最终会来自被\"部署\"进工作流去执行任务的 agent，而非对话。\n\n另一条则反驳了\"agent 会冲击某些软件品类\"的流行叙事，借 Atlassian 财报大超预期指出：当 agent 生成 100 倍的代码、处理海量数据、跨系统做决策时，管理这些数据和工作流的平台只会更重要，不会更不重要——治理、安全、合规、护栏恰恰是企业最在意的。\n\n🔗 https://x.com/levie/status/2085587079405425146 · https://x.com/levie/status/2085474309943030032\n\n### Replit CEO Amjad Masad：Airtable 为 no-code 的兴衰画上句号\n\n**Amjad Masad（amasad on X）**：\"Airtable 为 no-code 的兴衰画上了句号。我当年跟投资人反复争论过这件事：UI 永远不可能让你构建任意软件，让软件变得可及的路径始终是**解决代码本身**。这话曾经听起来很妄想，现在不是了。\"\n\n他还回忆 2021/22 年跑遍硅谷游说 Google、Meta 等训练代码专用模型，无人认同其重要性，最后 Replit 自己训了 replit-code-3b。\n\n🔗 https://x.com/amasad/status/2085451197323034902 · https://x.com/amasad/status/2085544020424716723\n\n### Vercel CEO Guillermo Rauch：AI 编码 agent 是史上最重要的开发工具\n\n**Guillermo Rauch（rauchg on X）** 提出开发者工具的两条铁律：必须开源，且必须可被普遍扩展。\"AI 编码 agent 是我们这个行业历史上最重要的开发工具。Plugin 标准让任何人都能以统一方式扩展它们。\"他认为这对生态是巨大利好——做一个 Plugin，就能触达 CLI、IDE、云端 agent 乃至个人助理的全部软件创作浪潮。\n\n🔗 https://x.com/rauchg/status/2085403169551790359\n\n### Meta AI 高级总监 Madhu Guru：让团队录音，别写文档\n\n**Madhu Guru（realmadhuguru on X）** 的一条沟通观察：\"人在口头讲述新想法时，比写成文档要清晰得多。在嘴巴和文档之间的某个地方，核心想法被埋掉了——因为人在试图补充背景、打磨措辞、让自己听起来聪明。\"\n\n他要求团队：像跟朋友解释那样把想法录下来，用 AI 做基础清理但保留原始的粗糙结构和行文，然后直接分享这份文档。\n\n🔗 https://x.com/realmadhuguru/status/2085390240899043406\n\n### 产品人 Peter Yang：消费级 AI 是 ChatGPT 和 Google 的，只看谁失手\n\n**Peter Yang（petergyang on X）** 判断：ChatGPT 已有 10 亿用户，两大障碍都不是模型能力——一是普通人不敢让 AI 全面接触自己的应用和数据，二是普通人根本不知道 ChatGPT 现在能干什么；这两点上营销和信息传达与产品改进同等重要。\n\nGemini 同样近 10 亿用户且在信任度上占优（同一套登录体系打通邮箱、日历、Workspace、Chrome），但在第三方插件、浏览器操作等关键能力上落后。他的一个直白结论：普通用户根本不在乎 Sol 还是 Fable，只要价格合理、活能干完。\n\n🔗 https://x.com/petergyang/status/2085427222836658600\n\n### FPV 合伙人 Nikunj Kothari：没有 VC 会告诉你的融资建议\n\n**Nikunj Kothari（nikunj on X）** 的一篇被疯转的长文。要点：找谁引荐极其关键，要先看这位 associate/principal 近期投过什么、在所内是什么位置——一旦被录进 CRM 归到某人名下就换不掉了；融资金额要得太多太少都是坑，VC 其实**不想要\"便宜的好 deal\"**，价格太低反而引发质疑；成熟的领投基金稀释率基本不会低于 10%；千万别拿竞对的估值做对比，这是最快搞砸交易的方式；也千万别撒谎，\"你说你有 term sheet，人家一条短信就能核实\"。\n\n最后：这是他见过共识度最高的市场，如果你不在热门赛道，讲清楚你为什么是个好的反共识押注。\n\n🔗 https://x.com/nikunj/status/2085382457457828153\n\n### YC CEO Garry Tan：个人 AGI\n\n**Garry Tan（garrytan on X）** 分享了他对\"个人 AGI\"的看法——不是人人都能有的那种聊天机器人，而是一个**独一无二地了解你**、并持续了解下去的 AI。\n\n🔗 https://x.com/garrytan/status/2085446068461043722\n\n### Anthropic 官方：Fable 5 生物学护栏放宽，误报降低约 85%\n\n**Anthropic（claudeai on X）** 更新 Claude Fable 5 的生物学安全护栏以减少误报，内部测试显示各产品面上生物学相关的拒答回退降低了约 **85%**，Fable 现在能处理更广泛的日常健康与教育类问题。\n\n但涉及双用途的请求——病毒学、毒理学、分子设计——仍会回退到 Opus 5，因此尚不能用于专业生物学研究和药物研发。官方表态：\"我们相信 AI 最大的正面影响将出现在生物学和医学领域。\"\n\n🔗 https://x.com/claudeai/status/2085563808773189680\n\n## 二、官方博客\n\n### Claude Blog：用 Foundation Models framework 为 Apple 平台构建智能应用\n\nAnthropic 发布了一个新的 Swift 包，让 Apple 开发者能通过苹果的 Foundation Models framework 直接调用 Claude。设计思路是分工：苹果的端侧模型负责快速本地任务（摘要、信息抽取），当请求需要多步推理、代码生成等更复杂的工作时**交接给 Claude**——Claude 还能联网搜索最新信息、执行代码做数据分析，响应可流式回到同一个视图里。\n\n一个关键的工程收益是：苹果框架通过 `@Generable` 注解返回类型化的 Swift 值，所以开发者抵达 Claude API 调用时拿到的是干净的结构化输入，而不是原始用户文本。\n\n官方举的例子很能说明模式的价值——日记应用可以在端侧生成每日提示，再让 Claude 跨越几个月的条目找出主题脉络；学习应用可以在端侧解释一个术语，当学生追问\"这为什么对我们学过的其他东西都很重要\"时再交接给 Claude。对用户是一套体验，每一步背后是合适的模型。\n\n支持 iOS 27、iPadOS 27、macOS 27、visionOS 27、watchOS 27，需用 Anthropic API key 登录，该包自行处理流式传输、工具调用和结构化响应。\n\n🔗 https://claude.com/blog/claude-for-foundation-models\n\n## 三、播客\n\n### The MAD Podcast：如何构建长任务 AI Agent —— Mitch Troyanovsky, Basis\n\n**核心结论**：长任务 agent 的瓶颈不是模型能力，而是你有没有像设计一家公司的流程那样，为不确定性实体设计出可验证的协作系统。\n\nMitch Troyanovsky 是 Basis 的联合创始人，这家独角兽公司的 agent 能自主运行数小时甚至数天，端到端完成整份报税表。这类工作没有编码任务那样现成的验证器，所以他被迫想清楚了很多别人还没遇到的问题。\n\n他最反直觉的一个视角是把 agent 设计**还原成组织设计**：\"人类早就习惯与非确定性系统协作了，只不过那些系统通常是他们的同事，而不是他们的电脑。公司和流程本质上就是在设计一套让非确定性实体协同解决问题的系统。\"想明白这点，答案就在会计师事务所现成的做法里：分步验证、独立复核、可确定性核对的检查项（试算平衡表是否配平、Excel 有没有报错），再加上那些\"会计一眼就知道不对\"但无法确定性验证的东西——后者正好可以做成 judge，既用在 evals 里也用在运行时。\n\n他对评测的标准高得罕见：\"假设你有 100 个 eval，全过了，看起来不错。但你有信心它能泛化到真实生产环境吗？我们的答案是：不能。\"他的类比很锋利——即使一个人 100 次全做对了，如果他是靠翻维基百科做对的，会计师事务所也不会雇他，那么同理也不该雇我们。\n\n这就是 Basis 押注**行为规格（behavior specs）**和过程监督而非只看结果的原因：对错误的过程给出正确答案，仍然是失败。但他也警告 behavior spec 是有维护成本的状态，\"你理想情况下应该尽可能少写\"——只挑那几条泛化性最强、最关键的，而不是把所有最佳实践都写下来。\n\n最扎心的一句是对 agent 开发者的批评：\"你会看到有人因为一个代码文件抽象得不好而崩溃，可他们的 context 简直是一坨狗屎。英语比代码更珍贵，因为**英语影响运行时性能，代码不影响**。\"\n\n> ⚠️ 数据说明：feed 中此期播客只提供了频道页链接，未提供具体视频 URL，属上游 feed 的数据缺口。\n\n🔗 https://www.youtube.com/@DataDrivenNYC/videos"}]};</script>

      var seg = url.pathname.split('/').filter(Boolean);
      if (host === 'x.com' || host === 'twitter.com') {
        return seg.length ? host + '/' + seg[0] : host;
      }
      if (host.indexOf('youtube.com') !== -1) {
        return seg[0] === 'watch' ? 'youtube.com · 视频' : 'youtube.com/' + (seg[0] || '');
      }
      if (!seg.length) return host;
      var tail = seg[seg.length - 1];
      return host + '/' + (tail.length > 26 ? tail.slice(0, 26) + '…' : tail);
    } catch (e) {
      return raw;
    }
  }

  var URL_RE = /(https?:\/\/[^\s<)（）]+)/g;

  function inline(raw) {
    return esc(raw).split(/(`[^`]+`)/g).map(function (part) {
      if (part.length > 1 && part.charAt(0) === '`' && part.charAt(part.length - 1) === '`') {
        return '<code>' + part.slice(1, -1) + '</code>';
      }
      return part
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(URL_RE, function (m) {
          return '<a href="' + m + '" target="_blank" rel="noopener">' + esc(prettyUrl(m)) + '</a>';
        });
    }).join('');
  }

  // 以 🔗 开头的段落是来源行 —— 抽出所有 URL 渲染成链接组
  function renderSources(text) {
    var found = text.match(URL_RE) || [];
    if (!found.length) return '<p>' + inline(text) + '</p>';
    return '<div class="sources">' + found.map(function (u) {
      return '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(prettyUrl(esc(u))) + '</a>';
    }).join('') + '</div>';
  }

  function render(md) {
    var lines = md.split(/\r?\n/);
    var out = [];
    var para = [];
    var quote = [];
    var list = null; // {tag:'ul'|'ol', items:[]}

    function flushPara() {
      if (!para.length) return;
      var text = para.join(' ');
      out.push(/^🔗/.test(text) ? renderSources(text) : '<p>' + inline(text) + '</p>');
      para = [];
    }
    function flushQuote() {
      if (!quote.length) return;
      out.push('<blockquote><p>' + quote.map(inline).join('<br>') + '</p></blockquote>');
      quote = [];
    }
    function flushList() {
      if (!list) return;
      out.push('<' + list.tag + '>' + list.items.map(function (i) {
        return '<li>' + inline(i) + '</li>';
      }).join('') + '</' + list.tag + '>');
      list = null;
    }
    function flushAll() { flushPara(); flushQuote(); flushList(); }

    lines.forEach(function (line) {
      var t = line.trim();

      if (t === '') { flushAll(); return; }

      var h = /^(#{2,4})\s+(.*)$/.exec(t);
      if (h) {
        flushAll();
        var level = Math.min(h[1].length, 3);
        out.push('<h' + level + '>' + inline(h[2]) + '</h' + level + '>');
        return;
      }

      if (t.indexOf('> ') === 0 || t === '>') {
        flushPara(); flushList();
        quote.push(t.replace(/^>\s?/, ''));
        return;
      }

      var ul = /^[-*]\s+(.*)$/.exec(t);
      if (ul) {
        flushPara(); flushQuote();
        if (!list || list.tag !== 'ul') { flushList(); list = { tag: 'ul', items: [] }; }
        list.items.push(ul[1]);
        return;
      }

      var ol = /^\d+\.\s+(.*)$/.exec(t);
      if (ol) {
        flushPara(); flushQuote();
        if (!list || list.tag !== 'ol') { flushList(); list = { tag: 'ol', items: [] }; }
        list.items.push(ol[1]);
        return;
      }

      flushQuote(); flushList();
      para.push(t);
    });

    flushAll();
    return out.join('\n');
  }

  // ── 日期工具（按本地日期解析，避免 UTC 偏移串期）──────────────
  var DOW = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  function issueDate(s) {
    var p = s.split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }
  function longDate(s) {
    var d = issueDate(s);
    return d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
  }
  function stamp(iso) {
    if (!iso) return '未知';
    var d = new Date(iso);
    var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  // ── 索引栏 ────────────────────────────────────────────────────
  var indexEl = document.getElementById('index');
  var readerEl = document.getElementById('reader');
  var current = null;

  document.getElementById('index-count').textContent = issues.length + ' 期';

  issues.forEach(function (it) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'issue-card';
    btn.dataset.issue = it.issue;
    btn.innerHTML =
      '<div class="date">' + it.issue + '<span class="dow">' + DOW[issueDate(it.issue).getDay()] + '</span></div>' +
      '<div class="head">' + esc(it.headline || '（未填写摘要）') + '</div>' +
      '<div class="tally">' +
        '<span>' + it.stats.tweets + ' 推文</span>' +
        '<span>' + it.stats.blogs + ' 博客</span>' +
        '<span>' + it.stats.podcasts + ' 播客</span>' +
        (it.rawMissing ? '<span class="nb">无 raw</span>' : '') +
      '</div>';
    btn.addEventListener('click', function () { show(it.issue, true); });
    indexEl.appendChild(btn);
  });

  function show(id, push) {
    var it = issues.filter(function (x) { return x.issue === id; })[0];
    if (!it) return;
    current = id;

    Array.prototype.forEach.call(indexEl.querySelectorAll('.issue-card'), function (c) {
      c.setAttribute('aria-current', c.dataset.issue === id ? 'true' : 'false');
    });

    var meta = [
      '<span>存档期号 <b>' + it.issue + '</b></span>',
      '<span>feed 生成于 <b>' + stamp(it.feedGeneratedAt) + '</b></span>',
      '<span>追踪 <b>' + it.stats.builders + '</b> 位建造者</span>',
      it.rawMissing
        ? '<span class="warn">原始数据未存档</span>'
        : '<span>原始数据 <b>' + (it.rawBytes / 1024).toFixed(0) + ' KB</b> · raw/' + it.issue + '.json</span>'
    ].join('');

    readerEl.innerHTML =
      '<div class="issue-head">' +
        '<div class="kicker">AI Builders 简报 · ' + DOW[issueDate(it.issue).getDay()] + '</div>' +
        '<h2>' + longDate(it.issue) + '</h2>' +
        (it.headline ? '<p class="headline">' + esc(it.headline) + '</p>' : '') +
      '</div>' +
      '<div class="meta-strip">' + meta + '</div>' +
      '<article class="body">' + render(it.body) + '</article>';

    if (push && history.replaceState) history.replaceState(null, '', '#' + id);
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  // j / k 与上下键在期号间跳转
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;

    var dir = 0;
    if (e.key === 'j' || e.key === 'ArrowDown') dir = 1;
    else if (e.key === 'k' || e.key === 'ArrowUp') dir = -1;
    else return;

    var idx = issues.findIndex(function (x) { return x.issue === current; });
    var next = idx + dir;
    if (next < 0 || next >= issues.length) return;
    e.preventDefault();
    show(issues[next].issue, true);
  });

  // ── 主题：跟随系统，可手动覆盖 ────────────────────────────────
  var saved = null;
  try { saved = localStorage.getItem('digest-theme'); } catch (e) {}
  if (saved === 'dark' || saved === 'light') {
    document.documentElement.setAttribute('data-theme', saved);
  }
  document.getElementById('theme-toggle').addEventListener('click', function () {
    var root = document.documentElement;
    var now = root.getAttribute('data-theme');
    if (!now) {
      now = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    var next = now === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('digest-theme', next); } catch (e) {}
  });

  // ── 启动 ──────────────────────────────────────────────────────
  if (!issues.length) {
    readerEl.innerHTML = '<p class="empty">还没有任何存档。运行 <code>node scripts/daily.js</code> 抓取第一期。</p>';
  } else {
    var want = decodeURIComponent(location.hash.replace(/^#/, ''));
    show(issues.some(function (x) { return x.issue === want; }) ? want : issues[0].issue, false);
  }
})();
</script>

</body>
</html>
