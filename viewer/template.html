<title>建造者档案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Noto+Serif+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ── 令牌：浅色为基准，两处深色块只重定义令牌 ───────────────────── */
:root {
  --paper:   #E9EDEB;
  --surface: #F8FAF9;
  --sunk:    #DFE5E2;
  --ink:     #141C1A;
  --ink-2:   #5A6764;
  --ink-3:   #869591;
  --rule:    #CFD8D4;
  --rule-2:  #E0E6E3;
  --accent:  #0D6B5C;
  --accent-wash: rgba(13, 107, 92, 0.09);
  --mark:    #8F6210;
  --warn-bg: rgba(143, 98, 16, 0.10);
  --shadow:  rgba(20, 28, 26, 0.08);

  --font-display: 'Fraunces', Georgia, 'Songti SC', serif;
  --font-body: 'Newsreader', 'Noto Serif SC', 'Songti SC', 'Source Han Serif SC', Georgia, serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  --sidebar-w: 18rem;
  --outline-w: 17rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:   #0E1211;
    --surface: #161C1A;
    --sunk:    #101615;
    --ink:     #E4E9E6;
    --ink-2:   #8D9C97;
    --ink-3:   #6B7A76;
    --rule:    #26302D;
    --rule-2:  #1E2724;
    --accent:  #4CC3A9;
    --accent-wash: rgba(76, 195, 169, 0.12);
    --mark:    #C9A24A;
    --warn-bg: rgba(201, 162, 74, 0.12);
    --shadow:  rgba(0, 0, 0, 0.4);
  }
}
:root[data-theme="dark"] {
  --paper:   #0E1211;
  --surface: #161C1A;
  --sunk:    #101615;
  --ink:     #E4E9E6;
  --ink-2:   #8D9C97;
  --ink-3:   #6B7A76;
  --rule:    #26302D;
  --rule-2:  #1E2724;
  --accent:  #4CC3A9;
  --accent-wash: rgba(76, 195, 169, 0.12);
  --mark:    #C9A24A;
  --warn-bg: rgba(201, 162, 74, 0.12);
  --shadow:  rgba(0, 0, 0, 0.4);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  font-optical-sizing: auto;
}
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

/* ── 报头 ─────────────────────────────────────────────────────── */
.masthead {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: baseline; gap: 1rem;
  padding: 0.85rem clamp(1rem, 3vw, 2rem);
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--rule);
}
.masthead h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.2rem;
  letter-spacing: -0.01em;
  font-variation-settings: 'SOFT' 0, 'WONK' 1;
  white-space: nowrap;
}
.masthead .tagline {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--ink-3);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.masthead .spacer { flex: 1; }
.theme-toggle {
  border: 1px solid var(--rule);
  background: var(--surface);
  color: var(--ink-2);
  font-family: var(--font-mono);
  font-size: 0.68rem;
  letter-spacing: 0.06em;
  padding: 0.3rem 0.6rem;
  border-radius: 999px;
  cursor: pointer;
  align-self: center;
  white-space: nowrap;
}
.theme-toggle:hover { color: var(--accent); border-color: var(--accent); }

/* ── 骨架 ─────────────────────────────────────────────────────── */
.outline {
  position: sticky; top: 4.2rem; align-self: start;
  max-height: calc(100vh - 5.5rem); overflow-y: auto;
  padding: 0.4rem 0 2rem 1rem; scrollbar-width: thin;
  border-left: 1px solid var(--rule-2);
}
.outline-head {
  font: 600 0.68rem/1 var(--font-mono); letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--ink-3); margin: 0 0 0.8rem;
}
.outline a {
  display: block;
  text-decoration: none; color: var(--ink-2);
  font-size: 0.79rem; line-height: 1.45;
  padding: 0.28rem 0 0.28rem 0.62rem;
  border-left: 2px solid transparent; margin-left: -0.62rem;
  transition: color .12s, border-color .12s;
}
/* 夹行必须放在没有内边距的元素上：overflow:hidden 裁的是 padding box，
   直接夹在 <a> 上会让 padding-bottom 把第三行的顶端露出来（实测 2.27 行）。 */
.outline a > .t {
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
  overflow: hidden;                     /* 超出两行由浏览器补省略号 */
}
.outline a:hover { color: var(--accent); }
.outline a.lv2 {
  font-weight: 600; color: var(--ink); margin-top: 0.9rem;
  font-size: 0.82rem;
}
.outline a.lv2:first-of-type { margin-top: 0; }
.outline a.lv3 { padding-left: 1.15rem; }
.outline a.lv4 {
  padding-left: 1.15rem; margin-top: 0.45rem;
  font-weight: 600; color: var(--ink);
}
.outline a.lv5 { padding-left: 1.9rem; font-size: 0.75rem; }
.outline a.lv6 {
  padding-left: 2.5rem; font-size: 0.72rem; color: var(--ink-3);
}
.outline a.here { color: var(--accent); border-left-color: var(--accent); }

/* ── 信息源弹窗 ───────────────────────────────────────────────── */
.modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
.modal[hidden] { display: none; }
.modal-back { position: absolute; inset: 0; background: color-mix(in srgb, var(--ink) 38%, transparent); backdrop-filter: blur(2px); }
.modal-card {
  position: relative; background: var(--surface); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 6px;
  box-shadow: 0 18px 48px var(--shadow);
  width: min(46rem, 100%); max-height: min(80vh, 46rem);
  display: flex; flex-direction: column;
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1rem 1.2rem 0.8rem; border-bottom: 1px solid var(--rule);
}
.modal-head h2 { margin: 0; font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; }
.modal-x {
  border: 0; background: transparent; cursor: pointer;
  color: var(--ink-3); font-size: 0.95rem; line-height: 1; padding: 0.3rem;
}
.modal-x:hover { color: var(--accent); }
.modal-body { overflow-y: auto; padding: 0.4rem 1.2rem 1.3rem; }
.sp-note {
  font: 400 0.74rem/1.6 var(--font-mono); color: var(--ink-2);
  margin: 0.9rem 0 0.2rem;
}

/* 两层：上游 / 补充源。层与层之间用一条横线和一个题头分开， */
/* 免得二十多个账号和五个补充源糊成一片。 */
.sp-tier { margin-top: 1.6rem; }
.sp-tier-head {
  display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap;
  font-family: var(--font-display); font-weight: 600; font-size: 0.95rem;
  color: var(--ink); padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--rule);
}
.sp-tier-sub {
  font: 400 0.7rem/1 var(--font-mono); color: var(--ink-2);
  letter-spacing: 0.02em;
}

.sp-group { margin-top: 1rem; }
.sp-group > h3 {
  font: 600 0.66rem/1 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-2); margin: 0 0 0.5rem;
  display: flex; align-items: baseline; gap: 0.45rem;
}
.sp-group > h3 .n {
  font-weight: 400; letter-spacing: 0; color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.sp-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.1rem; }
.sp-list.cols { grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: 0.1rem 1.2rem; }
.sp-list li {
  display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;
  padding: 0.32rem 0.4rem; margin-left: -0.4rem;
  border-radius: 3px; line-height: 1.5;
}
.sp-list li:hover { background: var(--sunk); }
.sp-list li.wide { display: block; padding-top: 0.45rem; padding-bottom: 0.45rem; }
.sp-list li.wide .sp-meta { margin-left: 0.5rem; }
.sp-list .sp-nm { font-size: 0.88rem; color: var(--ink); }
.sp-meta {
  font: 400 0.71rem/1.5 var(--font-mono); color: var(--ink-2);
  text-decoration: none; white-space: nowrap;
}
a.sp-meta:hover { color: var(--accent); }
.sp-desc {
  display: block; margin-top: 0.15rem;
  font: 400 0.73rem/1.55 var(--font-body); color: var(--ink-2);
}

.shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) var(--outline-w) minmax(0, 1fr);
  gap: clamp(1.5rem, 4vw, 3.5rem);
  max-width: 92rem;
  margin: 0 auto;
  padding: 0 clamp(1rem, 3vw, 2rem) 5rem;
}

/* ── 侧栏：期号索引 ────────────────────────────────────────────── */
.index {
  position: sticky;
  top: 3.6rem;
  align-self: start;
  max-height: calc(100vh - 4.5rem);
  overflow-y: auto;
  padding: 1.5rem 0 2rem;
  display: flex; flex-direction: column; gap: 0.5rem;
}
.index-head {
  font-family: var(--font-mono);
  font-size: 0.66rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-3);
  display: flex; justify-content: space-between; align-items: baseline;
  padding-bottom: 0.6rem;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 0.3rem;
}
.issue-card {
  display: block; width: 100%; text-align: left;
  border: 0; border-left: 2px solid transparent;
  background: transparent;
  color: inherit; font: inherit;
  padding: 0.7rem 0.75rem;
  cursor: pointer;
  border-radius: 0 4px 4px 0;
  transition: background 0.14s ease, border-color 0.14s ease;
}
.issue-card:hover { background: var(--sunk); }
.issue-card[aria-current="true"] {
  background: var(--accent-wash);
  border-left-color: var(--accent);
}
.issue-card .date {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.02rem;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
  display: flex; align-items: baseline; gap: 0.45rem;
}
.issue-card .dow {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--ink-3);
  letter-spacing: 0.08em;
}
.issue-card[aria-current="true"] .date { color: var(--accent); }
.issue-card .head {
  margin-top: 0.2rem;
  font-size: 0.83rem;
  line-height: 1.45;
  color: var(--ink-2);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.issue-card .tally {
  margin-top: 0.4rem;
  font-family: var(--font-mono);
  font-size: 0.63rem;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  display: flex; gap: 0.55rem; flex-wrap: wrap;
}
.issue-card .tally .nb { color: var(--mark); }

/* ── 阅读区 ───────────────────────────────────────────────────── */
.reader { padding: 2.5rem 0 0; min-width: 0; }
.issue-head { border-bottom: 2px solid var(--ink); padding-bottom: 1rem; margin-bottom: 0.9rem; }
.issue-head .kicker {
  font-family: var(--font-mono);
  font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--accent);
}
.issue-head h2 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(2rem, 5vw, 2.9rem);
  line-height: 1.08;
  letter-spacing: -0.025em;
  margin: 0.35rem 0 0.5rem;
  font-variant-numeric: tabular-nums;
  font-variation-settings: 'SOFT' 0, 'WONK' 1;
  text-wrap: balance;
}
.issue-head .headline {
  font-size: 1.06rem; line-height: 1.55; color: var(--ink-2); margin: 0;
  max-width: 46ch; text-wrap: pretty;
}
.meta-strip {
  display: flex; flex-wrap: wrap; gap: 0.4rem 1.1rem;
  font-family: var(--font-mono); font-size: 0.68rem;
  color: var(--ink-3); letter-spacing: 0.03em;
  margin-bottom: 2.2rem;
  font-variant-numeric: tabular-nums;
}
.meta-strip b { color: var(--ink-2); font-weight: 500; }
.meta-strip .warn { color: var(--mark); background: var(--warn-bg); padding: 0.1rem 0.45rem; border-radius: 3px; }

/* 正文排版 */
.body { max-width: 40rem; }
.body h2 {
  font-family: var(--font-display);
  font-weight: 600; font-size: 1.02rem;
  letter-spacing: 0.1em;
  color: var(--accent);
  margin: 3.2rem 0 1.4rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--rule);
  font-variation-settings: 'SOFT' 0, 'WONK' 0;
}
.body h2:first-child { margin-top: 0; }
.body h3 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.33rem;
  line-height: 1.28;
  letter-spacing: -0.015em;
  margin: 2.4rem 0 0.75rem;
  text-wrap: balance;
  font-variation-settings: 'SOFT' 0, 'WONK' 1;
}
.body p { margin: 0 0 1.05rem; line-height: 1.78; text-wrap: pretty; }

/* h4 = 延伸阅读的来源分组。要明显低于 h3（条目标题），又高于正文 */
.body h4 {
  font-family: var(--font-display); font-weight: 600;
  font-size: 0.98rem; line-height: 1.3; color: var(--ink);
  margin: 2.4rem 0 0.9rem; padding-top: 0.85rem;
  border-top: 1px solid var(--rule);
  display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap;
}
.body .tally-strip {
  font: 400 0.74rem/1.7 var(--font-mono);
  color: var(--ink-2);
  letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
  margin: -0.2rem 0 1.4rem;
  padding: 0.5rem 0.75rem;
  background: var(--sunk);
  border-radius: 4px;
}
.body .tally-strip .n { color: var(--ink); font-weight: 500; }
.body h4 .n {
  font: 400 0.72rem/1 var(--font-mono); color: var(--ink-3);
  letter-spacing: 0.04em;
}
.body h4 a {
  font: 400 0.72rem/1 var(--font-mono); color: var(--accent);
  text-decoration: none; border-bottom: 1px solid var(--rule);
}
.body h4 a:hover { border-bottom-color: var(--accent); }

/* 延伸阅读的链接清单：不用 bullet + 下划线，改成整行可读的条目。
   标题是主体，出处收成小号 mono 标签，背景说明缩进弱化。 */
.body ul.links {
  list-style: none; padding: 0; margin: 0 0 1.1rem;
  display: block;
}
.body ul.links > li {
  padding: 0.55rem 0.7rem 0.55rem 0.75rem;
  margin: 0; line-height: 1.55;
  border-left: 2px solid transparent;
  border-radius: 3px;
  transition: background .12s, border-color .12s;
}
.body ul.links > li + li { margin-top: 0.1rem; }
.body ul.links > li:hover {
  background: var(--accent-wash); border-left-color: var(--accent);
}
.body ul.links > li::marker { content: none; }
/* 第一个链接是标题，后面的是出处标签 */
.body ul.links > li > a:first-child {
  color: var(--ink); text-decoration: none;
  font-weight: 500; border-bottom: 1px solid transparent;
}
.body ul.links > li:hover > a:first-child {
  color: var(--accent); border-bottom-color: var(--rule);
}
.body ul.links > li { cursor: pointer; }
.body ul.links > li .d {
  display: block; margin-top: 0.22rem;
  font-size: 0.86rem; line-height: 1.62; color: var(--ink-2);
}
.body ul.links > li > a:not(:first-child) {
  display: inline-block; font: 400 0.7rem/1.5 var(--font-mono);
  color: var(--ink-2); text-decoration: none;
  padding: 0.05rem 0.4rem; margin-left: 0.15rem;
  border: 1px solid var(--rule-2); border-radius: 2px;
  vertical-align: 0.05em;
}
.body ul.links > li > a:not(:first-child):hover {
  color: var(--accent); border-color: var(--accent);
}
/* 链接清单里的背景说明：不要引用块那套边框，缩进弱化即可 */
.body ul.links + blockquote,
.body ul.links > li + blockquote { border-left: 0; }

/* h6 = AINews 自己的主题层（子版块 · 主题）*/
.body h6 {
  font: 500 0.76rem/1.45 var(--font-mono); color: var(--ink-2);
  letter-spacing: 0.01em; margin: 1.1rem 0 0.45rem;
}

/* h5 = 分组内部的板块（AINews 的 Twitter / Reddit 分区）*/
.body h5 {
  font-family: var(--font-display); font-weight: 600; font-size: 0.92rem;
  color: var(--ink); margin: 1.5rem 0 0.55rem;
  display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap;
}
.body h5 a, .body h4 a {
  font: 400 0.7rem/1 var(--font-mono); color: var(--ink-2);
  text-decoration: none; border-bottom: 1px solid var(--rule);
}
.body h5 a:hover, .body h4 a:hover { color: var(--accent); border-bottom-color: var(--accent); }
.body strong { font-weight: 600; color: var(--ink); }
.body code {
  font-family: var(--font-mono); font-size: 0.86em;
  background: var(--sunk); padding: 0.1em 0.35em; border-radius: 3px;
}
.body ul, .body ol { margin: 0 0 1.15rem; padding-left: 1.3rem; display: flex; flex-direction: column; gap: 0.55rem; }
.body li { line-height: 1.72; padding-left: 0.2rem; }
.body li::marker { color: var(--accent); font-family: var(--font-mono); font-size: 0.85em; }
/* 中性背景说明：细线 + 无底色，不抢戏 */
.body blockquote {
  margin: 0.15rem 0 0.9rem; padding: 0 0 0 0.9rem;
  border-left: 2px solid var(--rule); background: none;
  font-size: 0.92rem; line-height: 1.7; color: var(--ink-2);
}
.body blockquote p { margin: 0; }
/* 警告保留原来的醒目样式 */
.body blockquote.warn {
  margin: 0 0 1.3rem; padding: 0.85rem 1.1rem;
  background: var(--sunk);
  border-left: 2px solid var(--mark);
  border-radius: 0 4px 4px 0;
  color: var(--ink-2); font-size: 0.94rem; line-height: 1.65;
}
.body blockquote p:last-child { margin-bottom: 0; }

/* 来源链接组 */
.sources { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0 0 2rem; }
.sources a {
  font-family: var(--font-mono); font-size: 0.7rem;
  text-decoration: none; color: var(--ink-2);
  border: 1px solid var(--rule);
  background: var(--surface);
  padding: 0.28rem 0.6rem; border-radius: 999px;
  transition: color 0.14s ease, border-color 0.14s ease;
  white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}
.sources a:hover { color: var(--accent); border-color: var(--accent); }
.sources a::before { content: "↗ "; color: var(--ink-3); }
.sources a:hover::before { color: var(--accent); }

.empty { color: var(--ink-2); padding: 4rem 0; line-height: 1.7; }

/* ── 中/EN 切换 ────────────────────────────────────────────────── */
.lang-toggle {
  display: inline-flex;
  border: 1px solid var(--rule);
  border-radius: 999px;
  overflow: hidden;
  align-self: center;
}
.lang-toggle button {
  border: 0; background: var(--surface); color: var(--ink-2);
  font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.06em;
  padding: 0.3rem 0.7rem; cursor: pointer; white-space: nowrap;
}
.lang-toggle button + button { border-left: 1px solid var(--rule); }

/* ── 简报/灵感 切换：和 .lang-toggle 同一套视觉语言，两个按钮一个 pill ──
   以前是一个孤零零的「灵感」链接，点了就跳走，看不出「这是切换」；
   现在两个页面都摆出来，当前页高亮、不可点，另一页可点，读法和中/EN 一致 */
.site-toggle {
  display: inline-flex;
  border: 1px solid var(--rule);
  border-radius: 999px;
  overflow: hidden;
  align-self: center;
}
.site-toggle a, .site-toggle span {
  border: 0; background: var(--surface); color: var(--ink-2);
  font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.06em;
  padding: 0.3rem 0.7rem; white-space: nowrap; text-decoration: none;

      var seg = url.pathname.split('/').filter(Boolean);
      if (host === 'x.com' || host === 'twitter.com') {
        return seg.length ? host + '/' + seg[0] : host;
      }
      if (host.indexOf('youtube.com') !== -1) {
        return seg[0] === 'watch' ? 'youtube.com · 视频' : 'youtube.com/' + (seg[0] || '');
      }
      if (!seg.length) return host;
      var tail = seg[seg.length - 1];
      return host + '/' + (tail.length > 26 ? tail.slice(0, 26) + '…' : tail);
    } catch (e) {
      return raw;
    }
  }

  var URL_RE = /(https?:\/\/[^\s<)（）]+)/g;

  function inline(raw) {
    return esc(raw).split(/(`[^`]+`)/g).map(function (part) {
      if (part.length > 1 && part.charAt(0) === '`' && part.charAt(part.length - 1) === '`') {
        return '<code>' + part.slice(1, -1) + '</code>';
      }
      // 先切出 markdown 链接 [文字](地址)：里面的地址不能再被裸 URL 规则二次处理，
      // 否则会在已经生成的 <a href> 里再插一个 <a>
      return part.split(/(\[[^\]\[]+\]\(https?:\/\/[^)\s]+\))/g).map(function (seg) {
        var md = /^\[([^\]\[]+)\]\((https?:\/\/[^)\s]+)\)$/.exec(seg);
        if (md) {
          return '<a href="' + md[2] + '" target="_blank" rel="noopener">' +
            md[1].replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>') + '</a>';
        }
        return seg
          .replace(/⟨([^⟩]+)⟩/g, '<span class="n">$1</span>')
          .replace(/⟪([^⟫]+)⟫/g, '<span class="d">$1</span>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>')
          .replace(URL_RE, function (m) {
            return '<a href="' + m + '" target="_blank" rel="noopener">' + esc(prettyUrl(m)) + '</a>';
          });
      }).join('');
    }).join('');
  }

  // 以 🔗 开头的段落是来源行 —— 抽出所有 URL 渲染成链接组
  function renderSources(text) {
    var found = text.match(URL_RE) || [];
    if (!found.length) return '<p>' + inline(text) + '</p>';
    return '<div class="sources">' + found.map(function (u) {
      return '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(prettyUrl(esc(u))) + '</a>';
    }).join('') + '</div>';
  }

  function render(md) {
    // 去掉 <!-- EXTRA:START/END --> 这类标记 —— 它们是给脚本用的，不该显示
    md = md.replace(/<!--[\s\S]*?-->/g, '');
    var inExtra = false;
    var lines = md.split(/\r?\n/);
    var out = [];
    var para = [];
    var quote = [];
    var list = null; // {tag:'ul'|'ol', items:[]}

    function flushPara() {
      if (!para.length) return;
      var text = para.join(' ');
      if (/^⟦/.test(text)) {
        // 统计条：数字密集，用等宽小字排，别混进正文的衬线体
        out.push('<p class="tally-strip">' + inline(text.replace(/^⟦/, '')) + '</p>');
      } else {
        out.push(/^🔗/.test(text) ? renderSources(text) : '<p>' + inline(text) + '</p>');
      }
      para = [];
    }
    function flushQuote() {
      if (!quote.length) return;
      // ⚠️ 开头的是数据缺口警告，其余是中性背景说明 —— 两者不该长得一样
      var isWarn = /^\s*(⚠️|注意|警告)/.test(quote[0] || '');
      out.push('<blockquote' + (isWarn ? ' class="warn"' : '') + '><p>' +
        quote.map(inline).join('<br>') + '</p></blockquote>');
      quote = [];
    }
    function flushList() {
      if (!list) return;
      // 延伸阅读是「链接清单」，和正文的说理列表用途不同，样式也该不同
      var cls = inExtra && list.tag === 'ul' ? ' class="links"' : '';
      out.push('<' + list.tag + cls + '>' + list.items.map(function (i) {
        return '<li>' + inline(i) + '</li>';
      }).join('') + '</' + list.tag + '>');
      list = null;
    }
    function flushAll() { flushPara(); flushQuote(); flushList(); }

    lines.forEach(function (line) {
      var t = line.trim();

      if (t === '') { flushAll(); return; }

      // h4/h5 是「延伸阅读」用的分组层级 —— 以前被压成 h3，
      // 导致分组标签和新闻大标题一样大，层级整个塌掉
      var h = /^(#{2,6})\s+(.*)$/.exec(t);
      if (h) {
        flushAll();
        var level = h[1].length;
        if (level === 2) inExtra = /延伸阅读/.test(h[2]);
        out.push('<h' + level + '>' + inline(h[2]) + '</h' + level + '>');
        return;
      }

      if (t.indexOf('> ') === 0 || t === '>') {
        flushPara(); flushList();
        quote.push(t.replace(/^>\s?/, ''));
        return;
      }

      var ul = /^[-*]\s+(.*)$/.exec(t);
      if (ul) {
        flushPara(); flushQuote();
        if (!list || list.tag !== 'ul') { flushList(); list = { tag: 'ul', items: [] }; }
        list.items.push(ul[1]);
        return;
      }

      var ol = /^\d+\.\s+(.*)$/.exec(t);
      if (ol) {
        flushPara(); flushQuote();
        if (!list || list.tag !== 'ol') { flushList(); list = { tag: 'ol', items: [] }; }
        list.items.push(ol[1]);
        return;
      }

      flushQuote(); flushList();
      para.push(t);
    });

    flushAll();
    return out.join('\n');
  }

  // ── 日期工具（按本地日期解析，避免 UTC 偏移串期）──────────────
  var DOW = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  function issueDate(s) {
    var p = s.split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }
  function longDate(s) {
    var d = issueDate(s);
    return d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
  }
  function stamp(iso) {
    if (!iso) return '未知';
    var d = new Date(iso);
    var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  // ── 索引栏 ────────────────────────────────────────────────────
  var indexEl = document.getElementById('index');
  var readerEl = document.getElementById('reader');
  var current = null;

  document.getElementById('index-count').textContent = issues.length + ' 期';

  issues.forEach(function (it) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'issue-card';
    btn.dataset.issue = it.issue;
    btn.innerHTML =
      '<div class="date">' + it.issue + '<span class="dow">' + DOW[issueDate(it.issue).getDay()] + '</span></div>' +
      '<div class="head">' + esc(it.headline || '（未填写摘要）') + '</div>' +
      '<div class="tally">' +
        '<span>' + it.stats.tweets + ' ' + TEXT.tally[0] + '</span>' +
        '<span>' + it.stats.blogs + ' ' + TEXT.tally[1] + '</span>' +
        '<span>' + it.stats.podcasts + ' ' + TEXT.tally[2] + '</span>' +
        (it.rawMissing ? '<span class="nb">无 raw</span>' : '') +
      '</div>';
    btn.addEventListener('click', function () { show(it.issue, true); });
    indexEl.appendChild(btn);
  });

  function show(id, push) {
    var it = issues.filter(function (x) { return x.issue === id; })[0];
    if (!it) return;
    current = id;

    Array.prototype.forEach.call(indexEl.querySelectorAll('.issue-card'), function (c) {
      c.setAttribute('aria-current', c.dataset.issue === id ? 'true' : 'false');
    });

    var meta = [
      '<span>存档期号 <b>' + it.issue + '</b></span>',
      // 灵感页没有上游 feed，这一行整条不出 —— 写「未知」等于说了句废话
      TEXT.showFeedAt ? '<span>feed 生成于 <b>' + stamp(it.feedGeneratedAt) + '</b></span>' : '',
      '<span>' + TEXT.countWord.replace('{n}', it.stats.builders) + '</span>',
      it.rawMissing
        ? '<span class="warn">原始数据未存档</span>'
        : '<span>原始数据 <b>' + (it.rawBytes / 1024).toFixed(0) + ' KB</b> · ' + TEXT.rawPath + it.issue + '.json</span>'
    ].join('');

    // 「共 X 条 · 展示 Y 条 · 隐藏 Z 条」—— 只有灵感页的数据带 it.counts，
    // 简报页没有这个字段就什么都不渲染，模板两边共用不用分叉
    var countsLine = it.counts
      ? '<p class="idea-stats">本期候选 <b>' + it.counts.pool + '</b> 条 · 展示 <b>' +
        it.counts.displayed + '</b> 条 · 隐藏 <b>' + it.counts.hidden + '</b> 条</p>'
      : '';

    readerEl.innerHTML =
      '<div class="issue-head">' +
        '<div class="kicker">' + TEXT.kicker + ' · ' + DOW[issueDate(it.issue).getDay()] + '</div>' +
        '<h2>' + longDate(it.issue) + '</h2>' +
        (it.headline ? '<p class="headline">' + esc(it.headline) + '</p>' : '') +
        countsLine +
      '</div>' +
      '<div class="meta-strip">' + meta + '</div>' +
      '<div id="pane"></div>';

    renderPane(it);

    if (push && history.replaceState) history.replaceState(null, '', '#' + id);
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  // ── 中文简报 / 英文原文 两个视图 ──────────────────────────────
  // 中文是模型提炼过的；英文是 feed 里的原始内容，一字未改。
  // 原文按期单独存在 source/<期号>.json，点开才加载 —— 页面体积才不会随期数膨胀。
  var mode = 'zh';
  var sourceCache = {};

  // 大纲：从已渲染的 h2/h3/h4 现扒，不额外维护一份数据
  var spy = null;

  // 中文版由 Markdown 渲染成扁平的一串标签，层级只体现在 h4/h5/h6 上。
  // 这一趟把深度补回去：标题各占其层级，标题下的内容比它深一级。
  // 只处理「延伸阅读」那一节 —— 它永远排在最后，统计条是它的第一个元素。
  function layoutExtra(pane) {
    var strip = pane.querySelector('.tally-strip');
    if (!strip) return;
    var depth = -1;                       // 统计条本身要落在 0
    for (var el = strip; el; el = el.nextElementSibling) {
      var t = el.tagName;
      if (t === 'H4' || t === 'H5' || t === 'H6') {
        depth = { H4: 0, H5: 1, H6: 2 }[t];
        el.setAttribute('data-d', depth);
      } else if (t === 'BLOCKQUOTE') {
        // 这一节里的引用块只有两种：开头的取舍说明和末尾的抓取失败提示，
        // 都是整节级的话。它们排在最后一个 h6 之后，按「跟随上一个标题」
        // 算会被推到 d3，缩在子版块底下 —— 明明说的是整节的事。
        el.setAttribute('data-d', 0);
      } else {
        el.setAttribute('data-d', Math.min(depth + 1, 3));
      }
    }
  }


  // 简报标题是「前缀：主句；次句；次句」的写法。大纲是导航，不是正文 ——
  // 与其让 CSS 拦腰截断，不如切在分句边界上，留一个完整的意思。
  // 全文放进 title，鼠标悬停仍能看到。
  // 大纲的层级按**语义**取，不按标签深度：EN 视图整体比中文浅一级
  //（来源是 h3 而中文是 h4），照标签取会让 AINews 落在细体的 lv3、
  // 它的子版块反而落在粗体的 lv4，父子轻重颠倒。
  // 这里把 EN 的三层对齐到中文：来源 4 / 板块 5 / 子版块 6。
  function lvOf(h) {
    var c = h.classList;
    if (c) {
      if (c.contains('lk-src')) return 4;
      if (c.contains('lk-sec')) return 5;
      if (c.contains('lk-topic')) return 6;
    }
    return h.tagName.charAt(1);
  }

  function buildOutline() {
    var nav = document.getElementById('outline');
    var pane = document.getElementById('pane');
    if (!nav || !pane) return;
    if (spy) { window.removeEventListener('scroll', spy); spy = null; }

    // h5/h6 也要进大纲 —— 官方博客要能看到 OpenAI / DeepMind 这层，
    // AINews 的板块和主题分类同理，否则等于在大纲里把结构又压平了
    // 但博客正文**内部**的小标题不进大纲 —— 那是文章自己的结构，不是本期的导航。
    // 混进来既撑爆大纲，层级也会倒挂：文章的小节看上去比它所属的那篇博客还突出。
    var heads = [].slice.call(pane.querySelectorAll('h2, h3, h4, h5, h6, .lk-topic'))
      .filter(function (h) { return !h.closest('.article'); });
    if (heads.length < 3) { nav.innerHTML = ''; return; }

    var html = ['<div class="outline-head">本期大纲</div>'];
    var links = [];
    heads.forEach(function (h, i) {
      var id = 'sec-' + i;
      h.id = id;
      // 计数标记（⟨3 条⟩）在大纲里是噪声，去掉
      // 计数、出处链接文字在大纲里都是噪声
      // 计数（span.n）和出处角标（文字以 ↗ 结尾的链接）在大纲里都是噪声。
      // 按结构剥离而不是按文案写正则 —— 中文版和 EN 版的文案不一样，
      // 之前只写了中文的，EN 大纲就留下了「AINews 34 this issue ↗」。
      var clone = h.cloneNode(true);
      [].slice.call(clone.querySelectorAll('span.n')).forEach(function (x) { x.remove(); });
      [].slice.call(clone.querySelectorAll('a')).forEach(function (x) {
        if (/↗\s*$/.test(x.textContent)) x.remove();
      });
      var label = clone.textContent.replace(/\s+/g, ' ').trim();
      if (!label) return;
      html.push('<a href="#' + id + '" class="lv' + lvOf(h) + '"><span class="t">' +
        esc(label) + '</span></a>');
      links.push(id);
    });
    nav.innerHTML = html.join('');

    // 两行放不下的才挂 title —— 实测比按字数猜准，也不会给短条目乱加提示
    [].slice.call(nav.querySelectorAll('a > .t')).forEach(function (t) {
      if (t.scrollHeight > t.clientHeight + 1) t.parentNode.title = t.textContent;
    });

    // 滚动时高亮当前所在小节
    var as = [].slice.call(nav.querySelectorAll('a'));
    spy = function () {
      var best = 0;
      for (var i = 0; i < links.length; i++) {
        var el = document.getElementById(links[i]);
        if (el && el.getBoundingClientRect().top <= 120) best = i;
      }
      as.forEach(function (a, i) { a.classList.toggle('here', i === best); });
    };
    window.addEventListener('scroll', spy, { passive: true });
    spy();
  }


  // 今日提炼：模型从候选里挑出的十条左右，需求侧和上新侧都有。
  // 每条只回答四个问题 —— 是什么 / 谁在要 / 现状 / 值不值得。
  // 「怎么做」压成一行小字：读者的顺序是先判断再动手，
  // 上一版每条九段，太长了没人看。
  function renderPicks(it) {
    var picks = it.picks || [];
    if (!picks.length) return '';

    function dots(n) {
      n = Math.max(0, Math.min(5, n | 0));
      return '<span class="dots"><b>' + '●'.repeat(n) + '</b>' + '○'.repeat(5 - n) + '</span>';
    }

    // 卡片字段是模型写的一小段中文，里面会用 **强调** 标出「最该注意的那半句」。
    // 先转义再处理加粗 —— 顺序反了就等于把模型的输出当 HTML 执行。
    function fmt(t) {
      return esc(t).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    }

    var rows = picks.map(function (p, i) {
      var title = (mode === 'en' ? (p.titleEn || p.title) : (p.title || p.titleEn)) || '';
      var star = p.featured ? '<span class="rest-star" title="优质来源，排到本节最前">★</span>' : '';
      var head =
        '<div class="pick-top">' +
          '<span class="pick-n">' + (i + 1) + '</span>' +
          (p.url
            ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + star + esc(title) + '</a>'
            : '<span class="pick-t">' + star + esc(title) + '</span>') +
          (p.score != null && mode !== 'en'
            ? '<span class="pick-lv lv-worth">值得做' + dots(p.score) + '</span>'
            : '') +
        '</div>' +
        '<div class="pick-meta">' +
          (p.kind && mode !== 'en' ? '<span class="pick-kind">' + esc(p.kind) + '</span>' : '') +
          '<span class="pick-src">' + esc(p.source || '') + '</span>' +
        '</div>';

      var body;
      if (mode === 'en') {
        body = '<div class="pick-raw">' + esc(p.rawEn || '') + '</div>';
      } else {
        body = '<dl>' + (p.fields || []).map(function (f) {
          return '<dt>' + esc(f[0]) + '</dt><dd>' + fmt(f[1]) + '</dd>';
        }).join('') + '</dl>';
      }
      return '<div class="pick">' + head + body + '</div>';
    }).join('');

    return '<section class="picks">' +
      '<div class="picks-head"><h3>' + (mode === 'en' ? 'Worth building' : '值得做的') + '</h3>' +
      '<span class="sub">' + picks.length + ' 条 · 读过 ' + (it.stats.blogs || 0) +
      ' · 池 ' + (it.stats.tweets || 0) + '</span></div>' +
      rows + '</section>';
  }

  // 完整库：点子/产品各一节，一层结构，节标题下面直接是来源清单 + 条目列表。
  // 走结构化数据而不是 markdown 列表 —— 「标题 + 说明 + 来源 + 信号」
  // 四样东西塞进一个 li 里怎么排都别扭。
  function renderRest(it) {
    var groups = (mode === 'en' ? it.restEn : it.rest) || [];
    if (!groups.length) return '';

    function rowHtml(r) {
      var star = r.featured ? '<span class="rest-star" title="优质来源，排到本节最前">★</span>' : '';
      return '<li' + (r.featured ? ' class="rest-featured"' : '') + '>' +
        '<a class="rest-t" href="' + esc(r.url) + '" target="_blank" rel="noopener">' +
          star + esc(r.title) + '</a>' +
        '<p class="rest-d">' + esc(r.desc) + '</p>' +
        '<div class="rest-m"><span>' + esc(r.source) + '</span>' +
          (r.signal ? '<span>' + esc(r.signal) + '</span>' : '') + '</div>' +
      '</li>';
    }

    var srcLabel = mode === 'en' ? 'Sources: ' : '来源：';
    var body = groups.map(function (g) {
      var rows = g.rows.map(rowHtml).join('');
      var head = '<h3>' + esc(g.label) + '<span class="n">' + g.rows.length + '</span></h3>' +
        (g.sources.length ? '<p class="rest-src">' + srcLabel + esc(g.sources.join(' · ')) + '</p>' : '');
      return '<section class="rest-g" id="rest-' + esc(g.key) + '">' + head + '<ul class="rest-l">' + rows + '</ul></section>';
    }).join('');

    var tail = it.hidden
      ? '<p class="rest-tail">池子里另有 ' + it.hidden + ' 条排名在深挖线以下，没有读过，' +
        '因此不展示。它们仍然存在 ideas/raw/' + esc(it.issue) + '.json 里。</p>'
      : '';

    return '<section class="rest">' +
      '<div class="picks-head"><h3>' + (mode === 'en' ? 'Full library' : '完整库') + '</h3>' +
      '<span class="sub">' + (mode === 'en'
        ? 'Everything read, minus what is highlighted above'
        : '都读过了，去掉上面已经在「值得做」里出现过的') + '</span></div>' +
      body + tail + '</section>';
  }

  function renderPane(it) {
    var pane = document.getElementById('pane');
    if (!pane) return;

    if (mode === 'zh') {
      pane.innerHTML = renderPicks(it) + renderRest(it) +
        (it.body ? '<article class="body">' + render(it.body) + '</article>' : '');
      layoutExtra(pane);
      buildOutline();
      return;
    }

    if (it.rawMissing) {
      pane.innerHTML = '<p class="empty">这一期建立在归档机制之前，没有保存原始数据，' +
        '因此无法显示英文原文。<br>从 2026-08-22 期开始每期都有。</p>';
      buildOutline();
      return;
    }

    // EN 原文按期单独存文件、点开才加载 —— 页面体积不随期数增长。
    // 灵感页的英文正文是脚本拼好的 markdown，和中文版同一套结构。
    function paint(data) {
      return TEXT.enIsMarkdown
        ? renderPicks(it) + renderRest(it) +
          (data.bodyEn ? '<article class="body">' + render(data.bodyEn) + '</article>' : '')
        : renderSource(data);
    }

    if (sourceCache[it.issue]) {
      pane.innerHTML = paint(sourceCache[it.issue]);
      if (TEXT.enIsMarkdown) layoutExtra(pane);
      buildOutline();
      return;
    }

    pane.innerHTML = '<p class="empty">正在加载英文原文…</p>';
    fetch(TEXT.sourceDir + it.issue + '.json')
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (json) {
        sourceCache[it.issue] = json;
        if (current === it.issue && mode === 'en') {
          pane.innerHTML = paint(json);
          if (TEXT.enIsMarkdown) layoutExtra(pane);
          buildOutline();
        }
      })
      .catch(function (err) {
        pane.innerHTML = '<p class="empty">加载失败：' + esc(err.message) + '。<br>' +
          '如果你是双击本地 HTML 文件打开的，浏览器会禁止它读取同目录文件 —— 请改用站点地址访问。</p>';
      });
  }

  function shortStamp(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
    return (d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function hostOf(u) {
    try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; }
  }
  // 和 link-digest.js 里同名函数保持一致：让人点之前就知道去哪
  function linkLabel(url) {
    try {
      var u = new URL(url), h = u.hostname.replace(/^www\./, '');
      if (/^(x|twitter)\.com$/.test(h)) {
        var seg = u.pathname.split('/').filter(Boolean)[0];
        return seg && seg !== 'i' ? '@' + seg : 'x.com';
      }
      if (h === 'github.com') {
        var p = u.pathname.split('/').filter(Boolean);
        return p.length >= 2 ? 'GitHub/' + p[1] : 'GitHub';
      }
      return h;
    } catch (e) { return '原文'; }
  }

  function renderSource(src) {
    var out = [];
    var note = src.podcasts && src.podcasts.some(function (p) { return (p.transcript || '').length; });

    out.push('<div class="src-note">下面是 feed 中的英文原文，未经改写或删减。' +
      (note ? '播客转录为完整全文。' : '') + '</div>');

    if (src.x && src.x.length) {
      out.push('<h2>X / Twitter</h2>');
      src.x.forEach(function (a) {
        if (!a.tweets || !a.tweets.length) return;
        out.push('<div class="src-author">' + esc(a.name || '') +
          '<span>@' + esc(a.handle || '') + '</span></div>');
        a.tweets.forEach(function (t) {
          out.push('<div class="src-tweet"><p>' +
            esc(t.text || '').replace(/\n/g, '<br>') + '</p><div class="src-meta">' +
            (t.createdAt ? esc(shortStamp(t.createdAt)) + ' · ' : '') +
            '<a href="' + esc(t.url || '#') + '" target="_blank" rel="noopener">view on X ↗</a>' +
            '</div></div>');
        });
      });
    }

    if (src.blogs && src.blogs.length) {
      out.push('<h2>Official blogs</h2>');
      src.blogs.forEach(function (b) {
        out.push('<h3>' + esc(b.name || '') + '：' + esc(b.title || '') + '</h3>');
        out.push('<div class="src-meta">' + (b.publishedAt ? esc(b.publishedAt) + ' · ' : '') +
          '<a href="' + esc(b.url || '#') + '" target="_blank" rel="noopener">read original ↗</a></div>');
        // feed 给的正文是一整坨扁平文本，读起来是一堵墙。blog-body.js 回原文页
        // 把分段、小标题和正文内链接取了回来，有 body 就按结构渲染。
        if (b.body && b.body.length) {
          var html = '', open = false;
          b.body.forEach(function (blk) {
            var t = inline(blk.text);
            if (blk.tag === 'li') { if (!open) { html += '<ul>'; open = true; } html += '<li>' + t + '</li>'; return; }
            if (open) { html += '</ul>'; open = false; }
            if (blk.tag === 'h2') html += '<h4>' + t + '</h4>';
            else if (blk.tag === 'h3' || blk.tag === 'h4') html += '<h5>' + t + '</h5>';
            else if (blk.tag === 'quote') html += '<blockquote>' + t + '</blockquote>';
            else html += '<p>' + t + '</p>';
          });
          if (open) html += '</ul>';
          out.push('<div class="article">' + html + '</div>');
        } else {
          out.push('<div class="transcript">' + esc(b.content || '（无正文）') + '</div>');
        }
      });
    }

    if (src.podcasts && src.podcasts.length) {
      out.push('<h2>Podcasts</h2>');
      src.podcasts.forEach(function (p) {
        out.push('<h3>' + esc(p.name || '') + '：' + esc(p.title || '') + '</h3>');
        out.push('<div class="src-meta">' + (p.publishedAt ? esc(shortStamp(p.publishedAt)) + ' · ' : '') +
          '<a href="' + esc(p.url || '#') + '" target="_blank" rel="noopener">open ↗</a> · ' +
          (p.transcript || '').length.toLocaleString() + ' 字符</div>');
        out.push('<div class="transcript">' + esc(p.transcript || '（无转录）') + '</div>');
      });
    }

    // 补充源：AINews / Import AI / 官方博客的当期条目，英文原标题 + 原文链接。
    // 标题和 URL 全程由脚本从原文提取，没有经过任何模型。
    var extra = src.extra || {};
    var items = extra.items || [];
    if (items.length) {
      out.push('<h2>Aggregators &amp; official blogs</h2>');
      // 顺序由 scripts/groups.js 定义，构建时注入 —— 页面不自带副本，
      // 中文版和 EN 版读的是同一份定义，不会再各自漂移。
      var order = (window.__DIGESTS__ && window.__DIGESTS__.sourceOrder) || [];
      var byS = {}, names = [];
      items.forEach(function (i) {
        var k = i.source || 'Other';
        if (!byS[k]) { byS[k] = []; names.push(k); }
        byS[k].push(i);
      });
      names.sort(function (a, b) {
        var ia = order.indexOf(a), ib = order.indexOf(b);
        return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
      });

      // 和中文版同款的统计条。EN 是全量，不做剔除，所以只有一个数。
      out.push('<p class="tally-strip" data-d="0">' +
        '<span class="n">' + items.length + '</span> items: ' +
        names.map(function (k) {
          return esc(k) + ' <span class="n">' + byS[k].length + '</span>';
        }).join(' · ') + '</p>');
      names.forEach(function (name) {
        var g = byS[name];
        // 出处：官方站点地址一直存在数据里，这里挂到组标题上
        var home = (g.find(function (x) { return x.sourceHome; }) || {}).sourceHome;
        var issue = (g.find(function (x) { return x.issueUrl; }) || {}).issueUrl;
        out.push('<h3 class="lk-src" data-d="0">' + esc(name) + ' <span class="n">' + g.length + '</span>' +
          (issue ? ' <a href="' + esc(issue) + '" target="_blank" rel="noopener">this issue ↗</a>' : '') +
          (home ? ' <a href="' + esc(home) + '" target="_blank" rel="noopener">' + esc(hostOf(home)) + ' ↗</a>' : '') +
          '</h3>');
        // Import AI：期刊本身单独一行（标题 + Read more），它引用的一手来源
        // 都带着同一个 section = 期刊标题，会让标题重复出现，所以下面跳过。
        var issueItem = g.filter(function (x) { return x.isIssue; })[0];

        // 层级和中文版一一对应：板块 → 子版块 → 主题 → 条目
        var lastSec = null, lastSub = null, lastTopic = null;
        g.forEach(function (i) {
          var sec = (issueItem && i.section === issueItem.title) ? null : i.section;
          if (sec && sec !== lastSec) {
            out.push('<h4 class="lk-sec" data-d="1">' + esc(sec) + '</h4>');
            lastSec = sec; lastSub = null; lastTopic = null;
          }
          if (i.subsection && i.subsection !== lastSub) {
            out.push('<div class="lk-topic" data-d="2">' + esc(i.subsection) + '</div>');
            lastSub = i.subsection; lastTopic = null;
          }
          if (i.topic && i.topic !== lastTopic) {
            out.push('<div class="lk-sub" data-d="3">' + esc(i.topic) + '</div>');
            lastTopic = i.topic;
          }
          // 条目的缩进比它头上那层标题深一级。按条目自身算，不靠循环里的状态，
          // 免得某条缺 subsection 时沿用上一条的深度。
          var d = i.subsection ? 3 : (sec ? 2 : (lastSec ? 2 : 1));
          // 标题、描述、出处同属一个 <a>，整块可点 —— 和中文版一致。
          // 期刊本身加粗排在最前，不额外挂按钮。
          out.push('<a class="lk-item' + (i.isIssue ? ' lk-lead' : '') + '" data-d="' + d +
            '" href="' + esc(i.url) + '" target="_blank" rel="noopener">' +
            '<span class="t">' + esc(i.title) + '</span>' +
            (i.summary ? '<span class="s">' + esc(i.summary.replace(/^PLUS:\s*/i, 'Also: ')) + '</span>' : '') +
            '<span class="u">' + esc(hostOf(i.url)) + ' ↗' +
            (i.links || []).map(function (l) { return ' · ' + esc(linkLabel(l.url)); }).join('') +
            '</span></a>');
          (i.links || []).forEach(function (l) {
            out.push('<a class="lk-more" data-d="' + d + '" href="' + esc(l.url) + '" target="_blank" rel="noopener">' +
              esc(linkLabel(l.url)) + ' ↗</a>');
          });
        });
      });
      var failed = (extra.sources || []).filter(function (x) { return x.status === 'error'; });
      if (failed.length) {
        out.push('<div class="lk-fail">Failed to fetch: ' +
          esc(failed.map(function (x) { return x.name + ' (' + x.error + ')'; }).join('; ')) + '</div>');
      }
    }

    if (out.length === 1) out.push('<p class="empty">这一期的 feed 没有任何内容。</p>');
    return '<article class="body">' + out.join('') + '</article>';
  }

  // 条目的标题和描述属于同一块，点这一块的任何地方都跳到标题那个链接
  document.addEventListener('click', function (e) {
    if (e.target.closest('a')) return;
    var li = e.target.closest('.body ul.links > li');
    if (!li) return;
    var a = li.querySelector('a[href^="http"]');
    if (a) window.open(a.href, '_blank', 'noopener');
  });

  // 切换按钮
  Array.prototype.forEach.call(
    document.getElementById('lang-toggle').querySelectorAll('button'),
    function (btn) {
      btn.addEventListener('click', function () {
        var want = btn.dataset.mode;
        if (want === mode) return;
        mode = want;
        Array.prototype.forEach.call(
          document.getElementById('lang-toggle').querySelectorAll('button'),
          function (b) { b.setAttribute('aria-pressed', b.dataset.mode === mode ? 'true' : 'false'); }
        );
        var it = issues.filter(function (x) { return x.issue === current; })[0];
        if (it) renderPane(it);
      });
    }
  );

  // j / k 与上下键在期号间跳转
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;

    var dir = 0;
    if (e.key === 'j' || e.key === 'ArrowDown') dir = 1;
    else if (e.key === 'k' || e.key === 'ArrowUp') dir = -1;
    else return;

    var idx = issues.findIndex(function (x) { return x.issue === current; });
    var next = idx + dir;
    if (next < 0 || next >= issues.length) return;
    e.preventDefault();
    show(issues[next].issue, true);
  });

  // ── 主题：跟随系统，可手动覆盖 ────────────────────────────────
  var saved = null;
  try { saved = localStorage.getItem('digest-theme'); } catch (e) {}
  if (saved === 'dark' || saved === 'light') {
    document.documentElement.setAttribute('data-theme', saved);
  }
  // ── 信息源弹窗 ────────────────────────────────────────────────
  (function () {
    var btn = document.getElementById('sources-btn');
    var modal = document.getElementById('sources-modal');
    var bodyEl = document.getElementById('sources-body');
    if (!btn || !modal || !bodyEl) return;

    var built = false;
    function build() {
      if (built) return;
      var m = (window.__DIGESTS__ || {}).sourceManifest || {};
      var out = [];

      function esc2(x) { return esc(String(x == null ? '' : x)); }
      function host(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } }

      // 一组：小标题 + 条数 + 列表
      function group(title, list, render, cols) {
        if (!list || !list.length) return '';
        return '<section class="sp-group"><h3>' + esc2(title) +
          '<span class="n">' + list.length + '</span></h3>' +
          '<ul class="sp-list' + (cols ? ' cols' : '') + '">' +
          list.map(render).join('') + '</ul></section>';
      }

      function link(url, text) {
        if (!url) return '<span class="sp-meta">' + esc2(text) + '</span>';
        return '<a class="sp-meta" href="' + esc2(url) + '" target="_blank" rel="noopener">' +
          esc2(text) + ' ↗</a>';
      }

      // 面板的分组名两个站点不一样（简报是 X/博客/播客，灵感是需求侧/其余/订阅），
      // 版式完全相同，所以只把标签抽出来。P 默认是简报那套。
      var P = TEXT.panel || {
        note: '这是配置里的完整清单，不是当期出现过的统计。上游由 Follow Builders 抓取，补充源由本仓库抓取。',
        tier1: '上游 · Follow Builders', tier1sub: '建造者的 X、博客、播客',
        g1: 'X / Twitter', g2: '博客', g3: '播客',
        tier2: '补充源 · 延伸阅读', tier2sub: '每期末尾那一节的来源', g4: '聚合与官方博客'
      };

      out.push('<p class="sp-note">' + esc2(P.note) + '</p>');

      // ── 上游 ──
      out.push('<div class="sp-tier"><div class="sp-tier-head">' + esc2(P.tier1) +
        '<span class="sp-tier-sub">' + esc2(P.tier1sub) + '</span></div>' +
        group(P.g1, m.builders, function (b) {
          return '<li><span class="sp-nm">' + esc2(b.name) + '</span>' +
            link('https://x.com/' + b.handle, '@' + b.handle) + '</li>';
        }, true) +
        group(P.g2, m.blogs, function (b) {
          return '<li class="wide"><span class="sp-nm">' + esc2(b.name) + '</span>' +
            link(b.url, host(b.url)) +
            (b.note ? '<span class="sp-desc">' + esc2(b.note) + '</span>' : '') + '</li>';
        }, !m.blogs.some(function (b) { return b.note; })) +
        group(P.g3, m.podcasts, function (b) {
          return '<li class="wide"><span class="sp-nm">' + esc2(b.name) + '</span>' +
            link(b.url, host(b.url)) +
            (b.note ? '<span class="sp-desc">' + esc2(b.note) + '</span>' : '') + '</li>';
        }, !m.podcasts.some(function (b) { return b.note; })) +
        '</div>');

      // ── 补充源 ──
      out.push('<div class="sp-tier"><div class="sp-tier-head">' + esc2(P.tier2) +
        '<span class="sp-tier-sub">' + esc2(P.tier2sub) + '</span></div>' +
        group(P.g4, m.extra, function (x) {
          return '<li class="wide"><span class="sp-nm">' + esc2(x.name) + '</span>' +
            link(x.home, host(x.home)) +
            (x.note ? '<span class="sp-desc">' + esc2(x.note) + '</span>' : '') + '</li>';
        }) +
        '</div>');

      bodyEl.innerHTML = out.join('');
      built = true;
    }

    function open() { build(); modal.hidden = false; document.body.style.overflow = 'hidden'; }
    function close() { modal.hidden = true; document.body.style.overflow = ''; }

    btn.addEventListener('click', open);
    modal.addEventListener('click', function (e) {
      if (e.target.hasAttribute('data-close')) close();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !modal.hidden) close();
    });
  })();

  document.getElementById('theme-toggle').addEventListener('click', function () {
    var root = document.documentElement;
    var now = root.getAttribute('data-theme');
    if (!now) {
      now = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    var next = now === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('digest-theme', next); } catch (e) {}
  });

  // ── 上游停更检测 ──────────────────────────────────────────────
  // feed 由第三方仓库每天生成。它一旦停更，本站会静默停在最后一期，
  // 页面看上去毫无异常 —— 所以这里显式把陈旧程度摆出来。
  var STALE_DAYS = 3;
  function checkStale() {
    if (!issues.length) return;
    var newest = issues[0];
    if (!newest.feedGeneratedAt) return;
    var ageMs = Date.now() - new Date(newest.feedGeneratedAt).getTime();
    var days = Math.floor(ageMs / 86400000);
    if (days < STALE_DAYS) return;

    var bar = document.createElement('div');
    bar.className = 'stale-banner';
    bar.textContent = '⚠ 最新一期的上游 feed 已是 ' + days + ' 天前（' +
      newest.issue + '）。上游数据源可能已停止更新，或抓取任务出了问题。';
    document.querySelector('.masthead').insertAdjacentElement('afterend', bar);
  }

  // ── 启动 ──────────────────────────────────────────────────────
  if (!issues.length) {
    readerEl.innerHTML = '<p class="empty">还没有任何存档。运行 <code>node scripts/daily.js</code> 抓取第一期。</p>';
  } else {
    var want = decodeURIComponent(location.hash.replace(/^#/, ''));
    show(issues.some(function (x) { return x.issue === want; }) ? want : issues[0].issue, false);
    checkStale();
  }
})();
</script>
